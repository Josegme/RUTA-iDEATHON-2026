<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#F8F2E4">
<title>RUTA IDEATHON 2026 — V3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-primary:#0D607C;
    --brand-secondary:#EF8F49;
    --brand-secondary-shadow:#B9692A;
    --brand-dark:#073A4B;
    --brand-light:#F4F7F8;
    --success:#2F8F5C;
    --warning:#C23B3B;
    --ink:#122A33;
    --paper:#F8F2E4;
    --paper-2:#EFE7D3;
    --line:#DDD2B9;
    --tint-orange:#FCEBD5;
    --tint-blue:#E4EDEB;
    --tint-red:#F9E6DA;
    --tint-green:#E0EDD9;
    --radius:14px;
    --font-display:'Space Grotesk',system-ui,-apple-system,sans-serif;
    --font-body:'Work Sans',system-ui,-apple-system,sans-serif;
    color-scheme: only light;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:var(--font-display);}
  a{color:inherit;}
  button{font-family:var(--font-body);cursor:pointer;}
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{ outline:3px solid var(--brand-secondary); outline-offset:2px; }
  #app{min-height:100%;}
  .screen{max-width:640px;margin:0 auto;padding:20px 18px 64px;}
  .wide{max-width:1120px;}

  .topbar{
    position:sticky; top:0; z-index:10; padding-top:calc(10px + env(safe-area-inset-top,0px));
    background:var(--brand-dark); color:var(--brand-light);
    display:flex; align-items:center; justify-content:space-between;
    padding-left:18px; padding-right:18px; padding-bottom:10px;
  }
  .topbar .tname{font-family:var(--font-display); font-weight:700; letter-spacing:.02em;}
  .topbar .tmission{font-size:.78rem; opacity:.8;}
  .topbar button{ background:transparent; border:1px solid rgba(243,241,231,.35); color:var(--brand-light); border-radius:20px; padding:6px 12px; font-size:.78rem; }

  .hero{padding-top:10vh;}
  .hero h1{font-size:clamp(2.2rem,8vw,3.2rem); line-height:1.02; margin:0 0 6px;}
  .hero .sub{font-family:var(--font-display); font-weight:600; color:var(--brand-primary); font-size:1.15rem; margin:0 0 22px;}
  .hero p.tagline{font-size:1.02rem; line-height:1.5; max-width:46ch; color:var(--ink); opacity:.85; margin:0 0 40px;}
  .btn{
    display:inline-flex; align-items:center; gap:8px; justify-content:center;
    background:var(--brand-secondary); color:#fff; border:none;
    font-weight:700; font-size:1rem; padding:15px 26px; border-radius:999px;
    box-shadow:0 6px 0 0 var(--brand-secondary-shadow); transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 0 var(--brand-secondary-shadow);}
  .btn.secondary{background:transparent; color:var(--brand-primary); border:2px solid var(--brand-primary); box-shadow:none; padding:13px 24px;}
  .btn.secondary:active{transform:translateY(2px);}
  .btn.ghost{background:transparent; box-shadow:none; color:var(--ink); border:1px solid var(--line); padding:12px 20px;}
  .btn.small{padding:8px 14px; font-size:.8rem; box-shadow:none;}
  .btn[disabled]{opacity:.4; box-shadow:none; cursor:not-allowed; transform:none;}
  .footnote{margin-top:56px; font-size:.78rem; color:var(--ink); opacity:.55;}

  .grid-teams{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:22px;}
  .team-card{ border:2px solid var(--line); border-radius:var(--radius); padding:18px 14px; background:var(--paper-2); text-align:left; font-family:var(--font-display); font-weight:600; font-size:1.05rem; }
  .team-card small{display:block; font-family:var(--font-body); font-weight:400; font-size:.72rem; opacity:.65; margin-top:4px;}
  .team-card.done{border-color:var(--success);}

  .wheel-wrap{display:flex; flex-direction:column; align-items:center; margin-top:18px;}
  .wheel-frame{position:relative; width:min(78vw,300px); height:min(78vw,300px);}
  .pointer{ position:absolute; top:-6px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:14px solid transparent; border-right:14px solid transparent; border-top:22px solid var(--brand-dark); z-index:3; }
  .wheel{ width:100%; height:100%; border-radius:50%; position:relative; border:6px solid var(--brand-dark); transition:transform 4.2s cubic-bezier(.17,.67,.16,1); box-shadow:0 10px 30px rgba(0,0,0,.18); }
  .wheel .slice-pin{ position:absolute; top:50%; left:50%; width:36%; height:0; transform-origin:0 50%; }
  .wheel .slice-icon{ position:absolute; right:0; top:0; display:inline-block; font-size:1.5rem; line-height:1; filter:drop-shadow(0 1px 2px rgba(0,0,0,.25)); }
  .wheel-hub{ position:absolute; top:50%; left:50%; width:22%; height:22%; transform:translate(-50%,-50%); background:var(--paper); border-radius:50%; border:4px solid var(--brand-dark); display:flex; align-items:center; justify-content:center; font-size:1.4rem; z-index:2; }
  .mission-result{ margin-top:26px; width:100%; background:var(--paper-2); border-radius:var(--radius); border:1px solid var(--line); padding:22px; text-align:center; }
  .mission-result .kicker{font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--brand-primary); font-weight:600;}
  .mission-result h2{font-size:1.6rem; margin:6px 0 14px;}
  .mission-result .field{text-align:left; margin:10px 0; font-size:.92rem;}
  .mission-result .field b{display:block; font-family:var(--font-display); font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink); opacity:.6; margin-bottom:2px;}

  .trail{position:relative; margin:20px 0 10px; padding-left:34px;}
  .trail::before{ content:''; position:absolute; left:15px; top:8px; bottom:8px; width:3px; background:repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 12px); }
  .stop{position:relative; margin-bottom:14px;}
  .stop-btn{ width:100%; text-align:left; display:flex; gap:14px; align-items:center; background:var(--paper-2); border:2px solid var(--line); border-radius:var(--radius); padding:14px 16px; position:relative; }
  .stop-node{ position:absolute; left:-34px; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:50%; background:var(--paper); border:3px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:1rem; }
  .stop.completed .stop-node{background:var(--success); border-color:var(--success); color:#fff;}
  .stop.current .stop-btn{border-color:var(--brand-secondary); background:#FFF1E4;}
  .stop.current .stop-node{background:var(--brand-secondary); border-color:var(--brand-secondary); color:#fff;}
  .stop.pending .stop-btn{border-color:var(--warning); background:#FCEAE6;}
  .stop.pending .stop-node{background:var(--warning); border-color:var(--warning); color:#fff;}
  .stop.locked .stop-btn{opacity:.5;}
  .stop-title{font-family:var(--font-display); font-weight:600; font-size:.95rem;}
  .stop-sub{font-size:.76rem; opacity:.65; margin-top:2px;}
  .stop-tagline{font-size:.74rem; opacity:.55; margin-top:1px; font-style:italic;}
  .stamp{margin-left:auto; font-size:.7rem; color:var(--success); font-weight:700; white-space:nowrap;}

  .posta-head{margin-bottom:20px;}
  .posta-eyebrow{
    display:inline-block; font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    color:#fff; background:var(--brand-primary); padding:6px 14px; border-radius:20px; margin-bottom:6px;
  }
  .posta-head h2{font-size:1.7rem; margin:6px 0 8px;}
  .posta-head p{opacity:.8; line-height:1.5; margin:0;}
  .card{background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px;}
  .warn{ background:#FBEAE3; border:1px solid var(--warning); color:#7A2213; border-radius:10px; padding:10px 14px; font-size:.85rem; font-weight:600; margin:14px 0; }
  .notice{ background:#FDE9D3; border:1px solid var(--brand-secondary); color:#7A4413; border-radius:10px; padding:10px 14px; font-size:.85rem; font-weight:600; margin:14px 0; }
  .info-box{ background:#E4EEF1; border:1px solid var(--brand-primary); color:#0D4A5F; border-radius:10px; padding:10px 14px; font-size:.85rem; font-weight:600; margin:14px 0; }
  label{display:block; font-size:.82rem; font-weight:600; margin:14px 0 6px;}
  input[type=text], input[type=number], input[type=url], textarea, select{
    width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:.95rem;
  }
  textarea{min-height:76px; resize:vertical;}
  .obj-box{display:flex; align-items:center; justify-content:space-between; background:var(--paper); border:1px dashed var(--line); border-radius:10px; padding:12px 14px; margin:10px 0;}
  .progress-bar{height:10px; background:var(--paper); border-radius:6px; overflow:hidden; border:1px solid var(--line); margin-top:8px;}
  .progress-fill{height:100%; background:var(--brand-primary); transition:width .3s ease;}
  .choice-row{display:flex; flex-direction:column; gap:8px; margin-top:8px;}
  .choice{ border:1.5px solid var(--line); border-radius:10px; padding:11px 14px; text-align:left; background:var(--paper); font-size:.92rem; }
  .choice.selected{border-color:var(--brand-primary); background:#E4EEF1;}
  .idea-row{display:flex; gap:8px; align-items:center; margin:8px 0;}
  .idea-row span{font-family:var(--font-display); font-weight:700; opacity:.5; width:22px;}
  .footer-actions{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap;}
  .backlink{display:inline-block; margin-bottom:16px; font-size:.85rem; opacity:.7;}

  .stat-line{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:.9rem;}
  .stat-line:last-child{border-bottom:none;}
  .badge{width:24px; text-align:center;}
  .tabs{display:flex; gap:8px; margin:18px 0 6px; flex-wrap:wrap;}
  .tab{flex:1; min-width:110px; text-align:center; padding:9px; border-radius:10px; border:1.5px solid var(--line); font-weight:600; font-size:.85rem; background:var(--paper-2);}
  .tab.active{background:var(--brand-primary); color:#fff; border-color:var(--brand-primary);}

  .validation-block{border:1.5px solid var(--warning);}
  .validation-block h3{margin:2px 0 4px; font-size:1.05rem;}
  .confirm-panel{text-align:center; padding:34px 18px;}
  .confirm-panel .big{font-size:2.4rem; margin-bottom:8px;}
  .confirm-panel h2{margin:0 0 6px;}

  .history-item{padding:9px 0; border-bottom:1px solid var(--line); font-size:.85rem;}
  .history-item:last-child{border-bottom:none;}
  .history-item small{display:block; opacity:.6; margin-top:2px;}

  .admin-table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); margin-top:16px;}
  table{border-collapse:collapse; width:100%; min-width:1180px; font-size:.8rem;}
  th,td{padding:9px 11px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap;}
  thead th{background:var(--brand-dark); color:var(--brand-light); position:sticky; top:0;}
  tbody tr:hover{background:var(--paper-2); cursor:pointer;}
  .pill{display:inline-block; padding:3px 9px; border-radius:20px; font-size:.72rem; font-weight:700;}
  .pill.ok{background:#DCEFE1; color:var(--success);}
  .pill.mid{background:#FCEBCB; color:#8A5B0E;}
  .pill.no{background:var(--paper-2); color:var(--ink); opacity:.6;}
  .pill.alert{background:#FBE0D6; color:var(--warning);}
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin:16px 0;}
  .kpi{background:var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px;}
  .kpi b{display:block; font-family:var(--font-display); font-size:1.4rem;}
  .kpi span{font-size:.72rem; opacity:.65;}
  .filters{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0;}
  .filters select{width:auto; min-width:140px; font-size:.82rem; padding:8px 10px;}

  .modal-overlay{ position:fixed; inset:0; background:rgba(16,32,28,.55); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
  @media(min-width:640px){ .modal-overlay{align-items:center;} }
  .modal{ background:var(--paper); border-radius:18px 18px 0 0; max-width:560px; width:100%; max-height:88vh; overflow-y:auto; padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px)); }
  @media(min-width:640px){ .modal{border-radius:18px;} }
  .modal h3{margin-top:0;}
  .reopen-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}

  .mentor-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:.88rem;}
  .mentor-row-v2{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:14px 0; border-bottom:1px solid var(--line);}
  .mentor-row-v2:last-of-type{border-bottom:none;}
  .mentor-info{flex:1; min-width:180px;}
  .mentor-info b{font-size:.95rem;}
  .mentor-info small{display:block; opacity:.65; font-size:.78rem; margin-top:2px;}
  .mentor-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .mentor-edit{flex-direction:column; align-items:stretch;}
  .mentor-edit-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; width:100%;}
  .mentor-edit-grid label{margin:0 0 4px;}
  .mentor-row:last-child{border-bottom:none;}
  .mentor-row small{display:block; opacity:.6;}

  .public-fullscreen{
    max-width:1400px; margin:0 auto; padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));
    min-height:100dvh; display:flex; flex-direction:column; overflow-x:auto;
  }
  .public-topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .public-logo{height:26px; opacity:.85;}
  .public-title-compact{font-size:clamp(1.15rem,2.6vw,1.9rem); margin:2px 0 0; line-height:1.1; font-family:var(--font-display);}
  .public-sub-compact{font-size:clamp(.8rem,1.3vw,1rem); opacity:.65; margin:2px 0 12px; font-weight:600;}
  .lm-header-row, .lm-row{
    display:grid; grid-template-columns:minmax(78px,100px) minmax(110px,150px) minmax(240px,1fr) minmax(120px,190px) 56px minmax(110px,170px);
    align-items:center; gap:10px;
  }
  .lm-header-row{padding:0 12px 4px; font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; opacity:.55; font-weight:700;}
  .lm-header-row div:last-child, .lm-header-row div:nth-child(5){text-align:right;}
  .lm-list{display:flex; flex-direction:column; flex:1; justify-content:space-evenly; gap:6px;}
  .lm-row{padding:7px 12px; border-radius:10px; background:var(--paper-2); border:1px solid var(--line);}
  .lm-row.lm-finished{background:linear-gradient(90deg, rgba(47,143,92,.14), var(--paper-2)); border-color:var(--success);}
  .lm-group{font-family:var(--font-display); font-weight:700; font-size:clamp(.85rem,1.6vw,1.1rem); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lm-mission{font-size:clamp(.66rem,1.1vw,.82rem); opacity:.75; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lm-track{display:flex; align-items:center; gap:1px; overflow:visible; min-width:0;}
  .lm-node{
    width:15px; height:15px; min-width:12px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:.52rem; font-weight:700; border:2px solid var(--line); background:var(--paper); color:var(--ink); flex-shrink:1; transition:all .3s ease;
  }
  .lm-connector{flex:1 1 4px; height:3px; background:var(--line); min-width:2px; border-radius:2px;}
  .lm-connector.done{background:var(--success);}
  .lm-node.done{background:var(--success); border-color:var(--success); color:#fff;}
  .lm-node.current{background:var(--brand-primary); border-color:var(--brand-primary); color:#fff; width:21px; height:21px; min-width:18px; font-size:.62rem; box-shadow:0 0 0 3px rgba(13,96,124,.22); flex-shrink:0;}
  .lm-node.waiting{background:var(--brand-secondary); border-color:var(--brand-secondary); color:#fff; width:21px; height:21px; min-width:18px; font-size:.62rem; animation:pulseWait 1.4s ease-in-out infinite; flex-shrink:0;}
  .lm-node.pending{opacity:.4;}
  @keyframes pulseWait{ 0%,100%{ box-shadow:0 0 0 0 rgba(239,143,73,.5); } 50%{ box-shadow:0 0 0 8px rgba(239,143,73,0); } }
  .lm-current{font-size:clamp(.66rem,1.1vw,.82rem); opacity:.8; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lm-pct{font-family:var(--font-display); font-weight:700; font-size:clamp(.9rem,1.6vw,1.2rem); color:var(--brand-primary); text-align:right;}
  .lm-finished .lm-pct{color:var(--success);}
  .lm-estado{font-size:clamp(.64rem,1.1vw,.8rem); font-weight:700; text-align:right; white-space:nowrap;}
  .lm-estado-proceso{color:var(--brand-primary);}
  .lm-estado-esperando{color:var(--brand-secondary);}
  .lm-estado-reformulando{color:var(--warning);}
  .lm-estado-finalizado{color:var(--success);}
  .lm-estado-sin_iniciar{opacity:.55;}
  .public-legend-compact{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; font-size:clamp(.65rem,1.1vw,.8rem); opacity:.7; margin-top:10px;}
  .org-link{display:block; margin-top:14px; font-size:.75rem; opacity:.4; text-decoration:none;}
  .access-cards{display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; max-width:440px; margin-top:22px;}
  .access-card{display:flex; align-items:center; justify-content:center; text-align:center; min-height:64px; padding:14px 12px; background:var(--paper-2); border:2px solid var(--line); border-radius:var(--radius); font-family:var(--font-display); font-weight:700; font-size:1.1rem; color:var(--ink); text-decoration:none;}
  .access-card:hover{border-color:var(--brand-primary);}
  .attention-banner{background:#FBEAE3; border:2px solid var(--warning); border-radius:var(--radius); padding:12px 16px; margin:14px 0;}
  .attention-title{font-family:var(--font-display); font-weight:700; color:var(--warning); font-size:.95rem; margin-bottom:8px;}
  .attention-item{
    display:block; width:100%; text-align:left; background:transparent; border:none; border-top:1px solid rgba(194,59,59,.2);
    padding:6px 0; font-size:.85rem; color:var(--ink); font-weight:600;
  }
  .attention-item:first-of-type{border-top:none;}
  .attention-item:hover{color:var(--warning);}
  .chips-row{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0;}
  .chip{border:none; border-radius:20px; padding:6px 14px; font-size:.8rem; font-weight:700;}
  .chip-warn{background:#FBEAE3; color:var(--warning);}
  .chip-ok{background:#DCEFE1; color:var(--success);}
  .pill.proceso{background:#E4EEF1; color:var(--brand-primary);}
  .pill.esperando{background:#FDE9D3; color:#8A4E14;}
  /* ---------- V3: sorteo en vivo (escenario ruleta + lista lateral) ---------- */
  .stage{max-width:1120px; margin:0 auto; padding:20px 18px 64px; display:grid; grid-template-columns:minmax(0,1fr) 250px; gap:28px; align-items:start;}
  .stage.has-left{grid-template-columns:minmax(150px,210px) minmax(0,1fr) 250px;}
  .stage-left{position:sticky; top:calc(12px + env(safe-area-inset-top,0px)); align-self:start; padding-top:120px;}
  .stage-left .btn{width:100%;}
  .stage-main{min-width:0; display:flex; flex-direction:column; align-items:center;}
  .stage-status{width:100%; max-width:520px; text-align:center; font-weight:600; font-size:.95rem; padding:10px 14px; border-radius:10px; background:var(--paper-2); border:1px solid var(--line); margin:4px 0 14px;}
  .stage-status.hot{background:var(--tint-orange); border-color:var(--brand-secondary);}
  .draw-aside{position:sticky; top:calc(12px + env(safe-area-inset-top,0px)); background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius); padding:14px 12px;}
  .draw-aside-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:10px;}
  .draw-aside-head b{font-family:var(--font-display); font-size:.8rem; text-transform:uppercase; letter-spacing:.06em;}
  .draw-aside-head span{font-size:.72rem; opacity:.65; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .draw-list{display:flex; flex-direction:column; gap:8px;}
  .draw-card{position:relative; display:flex; flex-direction:column; gap:2px; padding:10px 12px; border-radius:10px; border:2px solid var(--line); background:var(--paper); transition:background .12s ease, border-color .12s ease, transform .12s ease;}
  .draw-card .dc-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .draw-card .dc-name{font-family:var(--font-display); font-weight:700; font-size:.95rem;}
  .draw-card .dc-ord{font-size:.68rem; font-weight:700; opacity:.6; font-variant-numeric:tabular-nums;}
  .draw-card .dc-sub{font-size:.72rem; opacity:.7;}
  .draw-card.is-hot{background:var(--brand-secondary); border-color:var(--brand-secondary); color:#fff; transform:scale(1.03);}
  .draw-card.is-hot .dc-sub, .draw-card.is-hot .dc-ord{opacity:.9;}
  .draw-card.is-turn{background:var(--tint-orange); border-color:var(--brand-secondary); animation:pulseWait 1.4s ease-in-out infinite;}
  .draw-card.is-done{opacity:.55; border-style:dashed;}
  .draw-card .btn{margin-top:8px; width:100%;}
  @media (max-width:860px){
    .stage, .stage.has-left{grid-template-columns:minmax(0,1fr); gap:14px;}
    .stage-left{position:static; padding-top:0; order:-2;}
    .draw-aside{position:static; order:-1; padding:10px; min-width:0;}
    .draw-list{flex-direction:row; overflow-x:auto; padding-bottom:4px; scroll-snap-type:x proximity;}
    .draw-card{min-width:132px; flex:0 0 auto; scroll-snap-align:start;}
  }
  @media (prefers-reduced-motion: reduce){
    .draw-card, .wheel{transition:none !important;}
    .draw-card.is-turn, .lm-node.waiting{animation:none;}
  }
  @media (max-width:860px){ .draw-admin-grid{grid-template-columns:minmax(0,1fr) !important;} .draw-admin-grid .draw-aside{min-width:0;} .draw-admin-grid .draw-aside{order:-1;} }
  .order-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .order-chip{font-size:.75rem; font-weight:700; padding:4px 10px; border-radius:20px; background:var(--paper); border:1px solid var(--line); font-variant-numeric:tabular-nums;}
  .public-turn{font-size:clamp(.8rem,1.3vw,1rem); font-weight:700; color:var(--brand-secondary); margin:-6px 0 10px;}

  /* ---------- V3: panel de mentor ---------- */
  .mentor-bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .req-card{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid var(--line);}
  .req-card:last-child{border-bottom:none;}
  .req-info{flex:1; min-width:180px;}
  .req-info b{font-family:var(--font-display);}
  .req-info small{display:block; opacity:.7; font-size:.78rem; margin-top:2px;}
  .req-wait{font-size:.78rem; font-weight:700; color:var(--brand-secondary); font-variant-numeric:tabular-nums;}
  .ctx-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px;}
  .ctx-card{background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; min-width:0;}
  .ctx-card h3{margin:0 0 4px; font-size:1.05rem; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .ctx-field{margin-top:10px; font-size:.86rem; line-height:1.4;}
  .ctx-field b{display:block; font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; opacity:.6; margin-bottom:2px;}
  .ctx-field .pending-txt{opacity:.55; font-style:italic;}
  .review-field{padding:10px 0; border-bottom:1px solid var(--line); font-size:.9rem;}
  .review-field:last-child{border-bottom:none;}
  .review-field b{display:block; font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; opacity:.6; margin-bottom:3px;}
  .review-field div{white-space:pre-wrap; overflow-wrap:anywhere;}
  .review-field a{color:var(--brand-primary); font-weight:600; overflow-wrap:anywhere;}
  .tab .count{display:inline-block; min-width:20px; padding:0 6px; margin-left:6px; border-radius:10px; background:var(--brand-secondary); color:#fff; font-size:.72rem;}
  .toast{position:fixed; left:50%; transform:translateX(-50%); top:calc(12px + env(safe-area-inset-top,0px)); z-index:80; max-width:min(92vw,460px); background:var(--brand-dark); color:var(--brand-light); padding:12px 18px; border-radius:12px; font-weight:700; font-size:.9rem; box-shadow:0 10px 30px rgba(0,0,0,.25);}
</style>

/* ---------- STORAGE ---------- */

/* ---------- SINCRONIZACIÓN (Supabase, tabla kv) ----------
   localStorage sigue siendo la caché local síncrona: cada escritura se sube a
   Supabase y los cambios de otros dispositivos se bajan por sondeo. Si no hay
   red, la app sigue funcionando en local. Apagada en localhost (pruebas) salvo
   con ?sync=1; se puede apagar en cualquier sitio con ?nosync. */
var SB_URL = 'https://erzghhfrlwjllmwmhtsn.supabase.co';
var SB_KEY = 'sb_publishable_c-YyUXwqwTx-ZW85hR7DqA_Oy_3pgXl';
var SYNC_POLL_MS = 2000;
var SYNC_ON = (function(){
  var h=location.hostname||'';
  if(/[?&]nosync\b/.test(location.search)) return false;
  if(/[?&]sync=1\b/.test(location.search)) return true;
  return !(h==='' || h==='localhost' || h==='127.0.0.1' || h==='[::1]' || location.protocol==='file:' || location.protocol==='blob:' || /claude/.test(h));
})();
var sync = {ready:false, dirty:{}, ver:{}, timers:{}, seen:{}, cursor:null, lastOk:0, polling:false, onChange:null};
function canon(v){
  if(v===null || typeof v!=='object') return JSON.stringify(v);
  if(Array.isArray(v)) return '['+v.map(canon).join(',')+']';
  return '{'+Object.keys(v).sort().map(function(k){ return JSON.stringify(k)+':'+canon(v[k]); }).join(',')+'}';
}
function syncHeaders(extra){
  var h={'apikey':SB_KEY, 'Content-Type':'application/json'};
  if(extra) Object.keys(extra).forEach(function(k){ h[k]=extra[k]; });
  return h;
}
function syncLocal(key){ try{ var r=localStorage.getItem(key); return r===null ? null : JSON.parse(r); }catch(e){ return null; } }
function syncQueue(key){
  if(!SYNC_ON || key.indexOf(STORAGE_PREFIX)!==0) return;
  sync.dirty[key]=true; sync.ver[key]=(sync.ver[key]||0)+1;
  clearTimeout(sync.timers[key]);
  sync.timers[key]=setTimeout(function(){ syncFlush(key); }, 120);
}
/* Un borrado viaja como marca {__deleted:true}: así los otros dispositivos
   también lo ven (el sondeo solo detecta filas nuevas o cambiadas). */
function syncFlush(key){
  if(!sync.ready || !sync.dirty[key]) return;
  var val=syncLocal(key), ver=sync.ver[key];
  var isReq = ((key===REQ_KEY || key===CONS_KEY) && val!==null);
  var p = isReq
    ? fetch(SB_URL+'/rest/v1/rpc/kv_merge_requests', {method:'POST', headers:syncHeaders(), body:JSON.stringify({p_key:key, p_incoming:val})})
    : fetch(SB_URL+'/rest/v1/kv?on_conflict=key', {method:'POST', headers:syncHeaders({'Prefer':'resolution=merge-duplicates,return=representation'}), body:JSON.stringify({key:key, value:(val===null ? {__deleted:true} : val)})});
  p.then(function(r){ if(!r.ok) throw new Error('sync '+r.status); return r.json(); }).then(function(j){
    sync.lastOk=Date.now();
    if(sync.ver[key]!==ver) return;
    delete sync.dirty[key];
    if(isReq){
      if(canon(j)!==canon(val)){ try{ localStorage.setItem(key, JSON.stringify(j)); }catch(e){} if(sync.onChange) sync.onChange([key]); }
    } else if(j && j[0]){ sync.seen[key]=j[0].updated_at; }
  }).catch(function(){ clearTimeout(sync.timers[key]); sync.timers[key]=setTimeout(function(){ syncFlush(key); }, 2000); });
}
function syncPull(cb){
  if(sync.polling){ if(cb) cb(false); return; }
  sync.polling=true;
  var q='/rest/v1/kv?select=key,value,updated_at&order=updated_at.asc&limit=1000';
  if(sync.cursor) q+='&updated_at=gt.'+encodeURIComponent(new Date(Date.parse(sync.cursor)-5000).toISOString());
  fetch(SB_URL+q, {headers:syncHeaders()}).then(function(r){ if(!r.ok) throw new Error('sync '+r.status); return r.json(); }).then(function(rows){
    var first=!sync.ready;
    var changed=syncApply(rows, first);
    /* En la primera carga manda lo que ya está en la nube. */
    if(first){ sync.dirty={}; sync.ready=true; }
    sync.lastOk=Date.now(); sync.polling=false;
    if(changed.length && sync.onChange) sync.onChange(changed);
    if(cb) cb(true);
  }).catch(function(){ sync.polling=false; if(cb) cb(false); });
}
/* Aplica filas de la nube a localStorage; devuelve las claves que cambiaron. */
function syncApply(rows, first){
  var changed=[];
  rows.forEach(function(row){
    var key=row.key;
    if(!key || key.indexOf(STORAGE_PREFIX)!==0) return;
    if(!sync.cursor || row.updated_at>sync.cursor) sync.cursor=row.updated_at;
    if(!first && sync.dirty[key]) return;
    if(sync.seen[key]===row.updated_at) return;
    sync.seen[key]=row.updated_at;
    var gone = !!(row.value && row.value.__deleted===true);
    if(canon(syncLocal(key))===canon(gone ? null : row.value)) return;
    try{ if(gone) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(row.value)); }catch(e){}
    changed.push(key);
  });
  return changed;
}
/* Canal en vivo (Supabase Realtime sobre WebSocket): baja los cambios casi al
   instante. Si se cae, el sondeo cada 2 s sigue cubriendo y se reconecta solo. */
function syncRealtime(){
  var ws, hb, ref=0;
  function send(o){ try{ ws.send(JSON.stringify(o)); }catch(e){} }
  function open(){
    try{ ws=new WebSocket(SB_URL.replace(/^http/,'ws')+'/realtime/v1/websocket?apikey='+encodeURIComponent(SB_KEY)+'&vsn=1.0.0'); }catch(e){ return; }
    ws.onopen=function(){
      send({topic:'realtime:rt-kv', event:'phx_join', ref:String(++ref), join_ref:'1', payload:{config:{broadcast:{ack:false,self:false}, presence:{key:''}, postgres_changes:[{event:'*',schema:'public',table:'kv'}], private_channel:false}}});
      hb=setInterval(function(){ send({topic:'phoenix', event:'heartbeat', payload:{}, ref:String(++ref)}); }, 25000);
    };
    ws.onmessage=function(m){
      var d; try{ d=JSON.parse(m.data); }catch(e){ return; }
      var rec = d && d.event==='postgres_changes' && d.payload && d.payload.data && d.payload.data.record;
      if(!rec || !sync.ready) return;
      sync.lastOk=Date.now();
      var changed=syncApply([rec], false);
      if(changed.length && sync.onChange) sync.onChange(changed);
    };
    ws.onclose=function(){ clearInterval(hb); setTimeout(open, 3000); };
    ws.onerror=function(){ try{ ws.close(); }catch(e){} };
  }
  open();
}
function syncStart(cb){
  if(!SYNC_ON){ cb(); return; }
  var done=false; function go(){ if(done) return; done=true; cb(); }
  setTimeout(go, 3500);
  syncPull(go);
  syncRealtime();
  setInterval(function(){ if(!document.hidden) syncPull(); }, SYNC_POLL_MS);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) syncPull(); });
  window.addEventListener('online', function(){ syncPull(); });
  /* Puntito de estado (abajo a la derecha): verde = sincronizado. */
  var dot=document.createElement('div');
  dot.style.cssText='position:fixed;right:8px;bottom:8px;width:9px;height:9px;border-radius:50%;opacity:.7;pointer-events:none;z-index:9999';
  document.body.appendChild(dot);
  setInterval(function(){
    var ok = sync.ready && (Date.now()-sync.lastOk)<8000;
    dot.style.background = ok ? '#2fbf71' : '#e5484d';
    dot.title = ok ? 'Sincronizado' : 'Sin conexión: los cambios se guardan solo en este dispositivo';
  }, 1000);
}

/* ---------- V3: SORTEO EN VIVO (estado compartido del juego) ---------- */
var GAME_KEY = STORAGE_PREFIX + 'game';
var REQ_KEY = STORAGE_PREFIX + 'requests';
var DRAW_MS = 4200;
function defaultGame(){ return {order:[], turnTeamId:null, drawStartedAt:null, drawPool:[], drawSeq:0, pendingMission:null}; }
function loadGame(){
  var g=safeGet(GAME_KEY); var d=defaultGame();
  if(!g) return d;
  Object.keys(d).forEach(function(k){ if(g[k]===undefined) g[k]=d[k]; });
  return g;
}
function saveGame(g){ safeSet(GAME_KEY,g); }
function teamsWithoutMission(){ return TEAM_IDS.filter(function(id){ return !loadTeam(id).mission; }); }
function assignedMissionIds(){ return TEAM_IDS.map(function(id){ var t=loadTeam(id); return t.mission?t.mission.id:null; }).filter(Boolean); }
function isDrawAnimating(g){ return !!(g.turnTeamId && g.drawStartedAt && (Date.now()-g.drawStartedAt) < DRAW_MS); }
function prefersReducedMotion(){ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }
/* Secuencia determinística: todas las pantallas muestran el mismo recorrido
   de colores y frenan en el mismo grupo, que ya fue elegido antes de animar. */
function drawSchedule(g){
  var pool=g.drawPool||[]; var n=pool.length; if(!n) return [];
  var targetIdx=Math.max(0,pool.indexOf(g.turnTeamId));
  var steps = n===1 ? 6 : Math.max(18, n*4);
  var start=((targetIdx-(steps-1))%n+n)%n;
  var T=DRAW_MS*0.95, out=[];
  for(var k=0;k<steps;k++){
    var p = steps>1 ? k/(steps-1) : 1;
    out.push({t: T*(1-Math.pow(1-p,1/3)), id: pool[(start+k)%n]});
  }
  return out;
}
function drawHotId(g){
  if(!isDrawAnimating(g)) return null;
  if(prefersReducedMotion()) return null;
  var e=Date.now()-g.drawStartedAt, sched=drawSchedule(g), hot=null;
  for(var i=0;i<sched.length;i++){ if(sched[i].t<=e) hot=sched[i].id; else break; }
  return hot;
}
function startDraw(){
  var g=loadGame();
  if(g.turnTeamId) return;
  var pool=teamsWithoutMission();
  if(!pool.length) return;
  var target=pool[Math.floor(Math.random()*pool.length)];
  g.drawPool=pool; g.turnTeamId=target; g.drawStartedAt=Date.now(); g.drawSeq=(g.drawSeq||0)+1; g.pendingMission=null;
  g.order=(g.order||[]).filter(function(id){ return id!==target; }); g.order.push(target);
  saveGame(g); render();
}
function undoTurn(){
  var g=loadGame();
  if(!g.turnTeamId || g.pendingMission || isDrawAnimating(g)) return;
  var tid=g.turnTeamId;
  g.order=(g.order||[]).filter(function(id){ return id!==tid; });
  g.turnTeamId=null; g.drawStartedAt=null; g.drawPool=[];
  saveGame(g); render();
}

/* ---------- V3: SOLICITUDES DE VALIDACIÓN ---------- */
function loadRequests(){ return safeGet(REQ_KEY) || []; }
/* Cada solicitud lleva un contador _n que sube con cada cambio: así, al
   sincronizar entre dispositivos, se conserva la versión más nueva de cada una. */
function stampVersions(a, prevList){
  var prev={}; prevList.forEach(function(r){ prev[r.id]=r; });
  a.forEach(function(r){
    var p=prev[r.id];
    if(!p){ r._n=r._n||1; return; }
    var x=Object.assign({},r), y=Object.assign({},p); delete x._n; delete y._n;
    if(JSON.stringify(x)!==JSON.stringify(y)) r._n=(p._n||0)+1;
  });
}
function saveRequests(a){ stampVersions(a, loadRequests()); safeSet(REQ_KEY,a); }
function isActiveReq(r){ return r.status==='open' || r.status==='claimed'; }
function activeRequestFor(teamId,pid){
  var a=loadRequests().filter(function(r){ return r.teamId===teamId && r.postaId===pid && isActiveReq(r); });
  return a.length ? a[a.length-1] : null;
}
function activeRequestForTeam(teamId){
  var a=loadRequests().filter(function(r){ return r.teamId===teamId && isActiveReq(r); });
  return a.length ? a[a.length-1] : null;
}
function updateRequest(id, fn){
  var reqs=loadRequests(); var found=null;
  reqs.forEach(function(r){ if(r.id===id){ fn(r); found=r; } });
  if(found) saveRequests(reqs);
  return found;
}
function setMentorEstadoRaw(mentorId, estado){
  var ms=loadMentors().map(function(m){ if(m.id===mentorId) m.estado=estado; return m; });
  saveMentors(ms);
}
function submitForValidation(team,pid){
  team.postas[pid].status='pending_validation';
  saveTeam(team);
  if(!activeRequestFor(team.id,pid)){
    var reqs=loadRequests();
    reqs.push({id:'rq'+Date.now()+'_'+Math.floor(Math.random()*1000), teamId:team.id, teamLabel:team.label, postaId:pid, status:'open', createdAt:Date.now(), claimedBy:null, claimedAt:null, resolvedAt:null, observation:'', reason:''});
    saveRequests(reqs);
  }
  state.notice=''; render();
}
/* Cancela solicitudes activas de un equipo (desde una posta en adelante) y libera al mentor. */
function cancelTeamRequests(teamId, fromIdx){
  var reqs=loadRequests(); var freed=[];
  reqs.forEach(function(r){
    if(r.teamId===teamId && isActiveReq(r) && POSTA_INDEX[r.postaId]>=fromIdx){
      if(r.status==='claimed' && r.claimedBy) freed.push(r.claimedBy);
      r.status='cancelled'; r.resolvedAt=Date.now();
    }
  });
  saveRequests(reqs);
  freed.forEach(function(mid){ var m=mentorById(mid); if(m && m.estado==='ocupado') setMentorEstadoRaw(mid,'disponible'); });
}
function cancelRequest(pid){
  var r=activeRequestFor(state.teamId,pid);
  if(r && r.status==='claimed'){ state.notice='Un mentor ya aceptó la solicitud y está en camino. Esperen la revisión.'; render(); return; }
  if(r) updateRequest(r.id, function(x){ x.status='cancelled'; x.resolvedAt=Date.now(); });
  var team=currentTeam(); team.postas[pid].status='current'; saveTeam(team);
  state.notice='Solicitud cancelada. Pueden seguir editando y volver a solicitar.'; render();
}
function resendRequest(pid){ var team=currentTeam(); submitForValidation(team,pid); }

/* ---------- V3.3: CONSULTAS A UN MENTOR ----------
   Llamada en cualquier momento a un mentor ELEGIDO por el grupo (solo si está
   disponible). Es independiente de la validación de postas: no aprueba ni
   rechaza nada. Se guarda en su propia clave para no tocar las solicitudes. */
var CONS_KEY = STORAGE_PREFIX + 'consultas';
function loadConsultas(){ return safeGet(CONS_KEY) || []; }
function saveConsultas(a){ stampVersions(a, loadConsultas()); safeSet(CONS_KEY,a); }
function isActiveCons(c){ return c.status==='open' || c.status==='claimed'; }
function activeConsultaFor(teamId){
  var a=loadConsultas().filter(function(c){ return c.teamId===teamId && isActiveCons(c); });
  return a.length ? a[a.length-1] : null;
}
function updateConsulta(id, fn){
  var list=loadConsultas(); var found=null;
  list.forEach(function(c){ if(c.id===id){ fn(c); found=c; } });
  if(found) saveConsultas(list);
  return found;
}
function freeMentorIfBusy(mid){ var m=mentorById(mid); if(m && m.estado==='ocupado') setMentorEstadoRaw(mid,'disponible'); }
function cancelTeamConsultas(teamId){
  var list=loadConsultas(); var freed=[];
  list.forEach(function(c){ if(c.teamId===teamId && isActiveCons(c)){ if(c.status==='claimed') freed.push(c.mentorId); c.status='cancelled'; c.resolvedAt=Date.now(); } });
  saveConsultas(list); freed.forEach(freeMentorIfBusy);
}
function cancelMentorConsultas(mid){
  var list=loadConsultas();
  list.forEach(function(c){ if(c.mentorId===mid && isActiveCons(c)){ c.status='cancelled'; c.resolvedAt=Date.now(); } });
  saveConsultas(list);
}
function openConsult(){ state.showConsult=true; state.consultNotice=''; render(); }
function closeConsult(){ state.showConsult=false; state.consultNotice=''; render(); }
function callMentor(mid){
  var team=currentTeam(); if(!team) return;
  if(activeConsultaFor(team.id)){ state.showConsult=false; render(); return; }
  var m=mentorById(mid);
  if(!m || m.estado!=='disponible'){ state.consultNotice='Ese mentor ya no está disponible. Elegí a otro.'; render(); return; }
  var list=loadConsultas();
  list.push({id:'cs'+Date.now()+'_'+Math.floor(Math.random()*1000), teamId:team.id, teamLabel:team.label, mentorId:mid, postaId:currentPostaId(team), status:'open', createdAt:Date.now(), claimedAt:null, resolvedAt:null});
  saveConsultas(list);
  state.showConsult=false; state.consultNotice=''; render();
}
function cancelConsult(){
  var team=currentTeam(); var c=team ? activeConsultaFor(team.id) : null;
  if(c && c.status==='open') updateConsulta(c.id, function(x){ x.status='cancelled'; x.resolvedAt=Date.now(); });
  render();
}
function finishConsultGroup(){
  var team=currentTeam(); var c=team ? activeConsultaFor(team.id) : null;
  if(c && c.status==='claimed'){ updateConsulta(c.id, function(x){ x.status='done'; x.resolvedAt=Date.now(); }); freeMentorIfBusy(c.mentorId); }
  render();
}
function consultSection(team){

    inner = '<b>¿Necesitan hablar con un mentor?</b>' +

  return '<div class="screen" style="padding-bottom:0;"><div class="card" style="margin-bottom:0;">'+inner+'</div></div>' + (state.showConsult ? renderConsultModal() : '');

var MENTOR_ESTADOS = [
  {k:'disponible', t:'Disponible'},
  {k:'ocupado', t:'Ocupado / Validando'},
  {k:'no_disponible', t:'No disponible'},
  {k:'inactivo', t:'Inactivo'}
];
function mentorEstadoLabel(k){ var e=MENTOR_ESTADOS.filter(function(x){return x.k===k;})[0]; return e?e.t:'Disponible'; }
function mentorFullName(m){
  var full=((m.nombre||'')+' '+(m.apellido||'')).trim();
  return full || m.name || 'Mentor';
}
function normalizeMentor(m){
  if(m.estado===undefined){ m.estado = (m.active===false) ? 'inactivo' : 'disponible'; }
  if(m.nombre===undefined || m.apellido===undefined){
    var parts=(m.name||'Mentor').trim().split(' ');

/* ---------- WHEEL (escenario: ruleta + lista lateral de sorteo) ---------- */
function renderDrawAside(g, interactive, onlyTeam){
  var anim=isDrawAnimating(g), hot=drawHotId(g), withMission=0;
  var cards=TEAM_IDS.map(function(id){
    var t=loadTeam(id); if(t.mission) withMission++;
    var ordIdx=(g.order||[]).indexOf(id);
    var ord = ordIdx>-1 ? ('#'+(ordIdx+1)) : '';
    var cls='draw-card', sub='En el sorteo', extra='';
    if(t.mission){ cls+=' is-done'; sub=t.mission.icon+' '+t.mission.name; }
    else if(anim){ if(hot===id) cls+=' is-hot'; ord=''; }
    else if(g.turnTeamId===id){
      cls+=' is-turn'; sub='Tiene el turno';
      if(interactive && (!onlyTeam || onlyTeam===id)){
        var confirmed = state.stageTeam===id || (g.pendingMission && g.pendingMission.teamId===id);
        extra = confirmed ? '<div class="dc-sub" style="margin-top:6px;font-weight:700;">✓ Grupo confirmado</div>'
          : '<button class="btn small" data-action="confirmStageTeam" data-stage-team="'+id+'">SOMOS ESTE GRUPO</button>';
      }
    }
    return '<div class="'+cls+'" data-dc="'+id+'">' +
      '<div class="dc-top"><span class="dc-name">'+teamLabel(id)+'</span><span class="dc-ord">'+ord+'</span></div>' +
      '<span class="dc-sub">'+esc(sub)+'</span>' + extra +
    '</div>';
  }).join('');
  return '<aside class="draw-aside" aria-label="Sorteo de grupos">' +
    '<div class="draw-aside-head"><b>Grupos</b><span>'+withMission+'/7 con misión</span></div>' +
    '<div class="draw-list">'+cards+'</div>' +
  '</aside>';
}
function stageStatus(g){
  var pending=teamsWithoutMission().length;
  var gm=state.groupMode;
  if(gm){
    var mt=loadTeam(gm);
    if(mt.mission) return {hot:false, text:'¡Listo! Su misión es '+mt.mission.name+'. Ya pueden empezar su ruta.'};
    if(isDrawAnimating(g)) return {hot:true, text:'Sorteando el próximo grupo…'};
    if(g.turnTeamId===gm){
      var mc = state.stageTeam===gm || (g.pendingMission && g.pendingMission.teamId===gm);
      return {hot:true, text: mc ? '¡Giren la rueda!' : '¡Les tocó! Toquen «Somos este grupo» en su tarjeta para habilitar el sorteo.'};
    }
    if(g.turnTeamId) return {hot:false, text:'Turno de '+teamLabel(g.turnTeamId)+'. Esperen el próximo sorteo.'};
    return {hot:false, text:'Están adentro. Esperen a que la organización lance el sorteo.'};
  }
  if(!pending && !g.turnTeamId) return {hot:false, text:'Sorteo completo: los 7 grupos ya tienen su misión.'};
  if(isDrawAnimating(g)) return {hot:true, text:'Sorteando el próximo grupo…'};
  if(g.turnTeamId){
    var confirmed = state.stageTeam===g.turnTeamId || (g.pendingMission && g.pendingMission.teamId===g.turnTeamId);
    if(!confirmed) return {hot:true, text:'Turno de '+teamLabel(g.turnTeamId)+'. Un integrante toque «Somos este grupo» en su tarjeta.'};
    return {hot:true, text:teamLabel(g.turnTeamId)+': giren la rueda.'};
  }
  return {hot:false, text:'Esperando que la organización sortee el próximo grupo.'};
}
function renderWheel(){
  var g=loadGame();
  var slices=7;
  var colors=['#0D607C','#EF8F49','#073A4B','#0D607C','#EF8F49','#073A4B','#EF8F49'];
  var gradParts=[];
  for(var i=0;i<slices;i++){ var a0=(360/slices)*i, a1=(360/slices)*(i+1); gradParts.push(colors[i]+' '+a0+'deg '+a1+'deg'); }
  var conic='conic-gradient('+gradParts.join(',')+')';
  var labels = MISSIONS.map(function(m,i){ var mid=(360/slices)*i+(360/slices)/2; return '<div class="slice-pin" style="transform:rotate('+mid+'deg);"><span class="slice-icon" style="transform:translate(50%,-50%) rotate('+(-mid)+'deg);">'+m.icon+'</span></div>'; }).join('');

  var anim=isDrawAnimating(g);
  var gm=state.groupMode;
  var turnId = anim ? null : g.turnTeamId;
  var confirmed = !!turnId && (state.stageTeam===turnId || (g.pendingMission && g.pendingMission.teamId===turnId));
  if(gm && turnId!==gm) confirmed=false;
  /* Si la misión ya se sorteó para este turno (por ejemplo, tras recargar), se muestra directamente. */
  var landed = state.wheelLanded;
  var restRotation = '';
  if(!landed && turnId && g.pendingMission && g.pendingMission.teamId===turnId){
    landed = MISSIONS.filter(function(m){ return m.id===g.pendingMission.missionId; })[0] || null;
  }
  if(state.remoteSpin) landed=null;
  if(landed){ var idxL=MISSIONS.indexOf(landed); restRotation='transform:rotate('+(5*360+(360-((360/7)*idxL+(360/7)/2)))+'deg);transition:none;'; }

  var resultBlock='';
  if(landed && turnId){
    var m = landed;
    resultBlock = '<div class="mission-result">' +
      '<div class="kicker">'+teamLabel(turnId)+' · su misión es</div>' +
      '<h2>'+m.icon+' '+esc(m.name)+'</h2>' +
      '<div class="field"><b>Eje</b>'+esc(m.eje)+'</div>' +
      '<div class="field"><b>Pregunta disparadora</b>'+esc(m.pregunta)+'</div>' +
      '<div class="field"><b>Foco</b>'+esc(m.foco)+'</div>' +
      '<div class="warn">Todavía no busquen la solución. Primero identifiquen una situación concreta.</div>' +
      ((!gm || gm===turnId) ? '<button class="btn" style="margin-top:6px;width:100%;" data-action="acceptMission">ACEPTAR MISIÓN</button>' : '<p style="font-size:.85rem;opacity:.7;margin:6px 0 0;">Esperando que '+teamLabel(turnId)+' acepte su misión.</p>') +
    '</div>';
  } else if(gm && loadTeam(gm).mission){
    var myM=loadTeam(gm).mission;
    resultBlock = '<div class="mission-result">' +
      '<div class="kicker">Match confirmado</div>' +
      '<h2>'+teamLabel(gm)+' · '+myM.icon+' '+esc(myM.name)+'</h2>' +
      '<button class="btn" data-action="goRouteFromStage" data-stage-team="'+gm+'">IR A NUESTRA RUTA →</button>' +
    '</div>';
  } else if(state.lastAccepted && !turnId && !anim && !gm){
    var la=state.lastAccepted, lm=MISSIONS.filter(function(x){return x.id===la.missionId;})[0];
    var laTeam=loadTeam(la.teamId);
    if(lm && laTeam.mission && laTeam.mission.id===lm.id){
      resultBlock = '<div class="mission-result">' +
        '<div class="kicker">Match confirmado</div>' +
        '<h2>'+teamLabel(la.teamId)+' · '+lm.icon+' '+esc(lm.name)+'</h2>' +
        '<p style="font-size:.9rem;opacity:.8;margin:0 0 14px;">El grupo ya puede entrar a su ruta desde su dispositivo con «Comenzar».</p>' +
        '<button class="btn secondary" data-action="goRouteFromStage" data-stage-team="'+la.teamId+'">IR A LA RUTA DE '+teamLabel(la.teamId)+'</button>' +
      '</div>';
    }
  }
  var st=stageStatus(g);
  var canSpin = confirmed && !landed && !state.remoteSpin;
  var noticeHtml = state.notice ? '<div class="notice" style="width:100%;max-width:520px;">'+esc(state.notice)+'</div>' : '';
  var headHtml = gm
    ? '<h2 style="text-align:center;margin:0 0 6px;">¡Bienvenidos, '+teamLabel(gm)+'!</h2>'
    : '<a href="#" class="backlink" data-nav="welcome" style="align-self:flex-start;">← Volver</a><h2 style="text-align:center;margin:0 0 6px;">Sorteo</h2>';
  var drawLeft = gm ? '' : '<div class="stage-left"><button class="btn" data-action="startDraw" '+((!g.turnTeamId && teamsWithoutMission().length>0)?'':'disabled')+'>SORTEAR</button></div>';
  return (gm ? topbar(loadTeam(gm)) : '') + '<div class="stage'+(gm?'':' has-left')+'">' +
    drawLeft +
    '<div class="stage-main">' +
      headHtml +
      (gm ? '<div class="stage-status'+(st.hot?' hot':'')+'" id="stageStatus">'+esc(st.text)+'</div>' : '') +
      noticeHtml +
      '<div class="wheel-frame"><div class="pointer"></div><div class="wheel" id="wheelEl" style="background:'+conic+';'+restRotation+'">'+labels+'<div class="wheel-hub">🌎</div></div></div>' +
      '<button class="btn" id="spinBtn" style="margin-top:22px;" '+(canSpin?'':'disabled')+'>GIRAR LA RUEDA</button>' +
      '<p style="opacity:.6;text-align:center;font-size:.8rem;max-width:40ch;margin:10px 0 0;">Cada misión se asigna a un solo grupo. Una vez aceptada, no se puede volver a girar.</p>' +
      resultBlock +
    '</div>' +
    renderDrawAside(g, true, gm) +
  '</div>';
}
function confirmStageTeam(id){
  var g=loadGame();
  if(g.turnTeamId!==id || isDrawAnimating(g)) return;
  if(state.groupMode && state.groupMode!==id) return;
  state.stageTeam=id; state.lastAccepted=null; state.notice=''; render();
}
function pickMission(){
  var taken=assignedMissionIds();
  var avail=MISSIONS.filter(function(m){ return taken.indexOf(m.id)===-1; });
  if(avail.length===0) return null;
  return avail[Math.floor(Math.random()*avail.length)];
}
function spinWheel(){
  var wheelEl=document.getElementById('wheelEl');
  var spinBtn=document.getElementById('spinBtn');
  if(!wheelEl || wheelEl.dataset.spinning==='1') return;
  var g=loadGame(); var tid=g.turnTeamId;
  if(!tid || isDrawAnimating(g)) return;
  if(state.groupMode && state.groupMode!==tid) return;
  var target=null;
  if(g.pendingMission && g.pendingMission.teamId===tid){
    target=MISSIONS.filter(function(m){ return m.id===g.pendingMission.missionId; })[0];
  }
  if(!target){
    target=pickMission();
    if(!target){ state.notice='No quedan misiones libres.'; render(); return; }
    g.pendingMission={teamId:tid, missionId:target.id}; saveGame(g);
  }
  state.spunKey=spinKey(g);
  wheelEl.dataset.spinning='1'; spinBtn.setAttribute('disabled','disabled');
  var sliceAngle=360/7; var idx=MISSIONS.indexOf(target);
  var sliceCenter=sliceAngle*idx+sliceAngle/2;
  var finalRotation=5*360+(360-sliceCenter);
  var dur = prefersReducedMotion() ? 50 : 4300;
  if(prefersReducedMotion()) wheelEl.style.transition='none';
  wheelEl.style.transform='rotate('+finalRotation+'deg)';
  setTimeout(function(){ state.wheelLanded=target; wheelEl.dataset.spinning='0'; pendingSoftRender=false; render(); }, dur);
}
function acceptMission(){
  var g=loadGame(); var tid=g.turnTeamId;
  if(!tid || !g.pendingMission || g.pendingMission.teamId!==tid) return;
  if(state.groupMode && state.groupMode!==tid) return;
  var m=MISSIONS.filter(function(x){ return x.id===g.pendingMission.missionId; })[0];
  var clash=TEAM_IDS.some(function(id){ var t=loadTeam(id); return id!==tid && t.mission && t.mission.id===m.id; });
  if(clash){
    g.pendingMission=null; saveGame(g); state.wheelLanded=null;
    state.notice='Esa misión ya fue asignada a otro grupo. Giren la rueda de nuevo.'; render(); return;
  }
  var team=loadTeam(tid);
  team.mission=m; team.missionAcceptedAt=Date.now(); team.postas.p1.enteredAt=Date.now();
  markMissionTaken(m.id);
  saveTeam(team);
  g.turnTeamId=null; g.drawStartedAt=null; g.drawPool=[]; g.pendingMission=null; saveGame(g);
  state.wheelLanded=null; state.stageTeam=null; state.notice=''; state.lastAccepted={teamId:tid, missionId:m.id};
  render();
}
function goRouteFromStage(id){ state.lastAccepted=null; go('map', {teamId:id, tab:'mapa'}); }

/* El giro hecho en otro dispositivo (por ejemplo, el celular del grupo) se
   reproduce también en la pantalla proyectada. */
function spinKey(g){ return g.pendingMission ? (g.pendingMission.teamId+':'+g.pendingMission.missionId+':'+g.drawSeq) : null; }
function maybeRemoteSpin(){
  if(state.screen!=='wheel') return;
  var g=loadGame(); var key=spinKey(g);
  if(!key || state.spunKey===key || isWheelSpinning() || state.wheelLanded) { if(key && !state.spunKey) state.spunKey=key; return; }
  state.spunKey=key; state.remoteSpin=true; render();
  var wheelEl=document.getElementById('wheelEl'); if(!wheelEl){ state.remoteSpin=false; return; }
  var m=MISSIONS.filter(function(x){ return x.id===g.pendingMission.missionId; })[0];
  var idx=MISSIONS.indexOf(m), sliceAngle=360/7;
  var finalRotation=5*360+(360-(sliceAngle*idx+sliceAngle/2));
  var dur = prefersReducedMotion() ? 50 : 4300;
  wheelEl.dataset.spinning='1';
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    if(prefersReducedMotion()) wheelEl.style.transition='none';
    wheelEl.style.transform='rotate('+finalRotation+'deg)';
  }); });
  setTimeout(function(){ wheelEl.dataset.spinning='0'; state.remoteSpin=false; pendingSoftRender=false; render(); }, dur+100);
}

/* Animación de la lista: solo cambia clases (no re-renderiza), así sobrevive a refrescos. */
var drawAnimRunning=false;
function runDrawAnimation(){
  if(drawAnimRunning) return;
  var g=loadGame(); if(!isDrawAnimating(g)) return;
  drawAnimRunning=true;
  (function tick(){
    var gg=loadGame();
    if(!isDrawAnimating(gg)){ drawAnimRunning=false; softRender(); return; }
    var hot=drawHotId(gg);
    Array.prototype.forEach.call(document.querySelectorAll('.draw-card[data-dc]'), function(el){
      var id=el.getAttribute('data-dc');
      if(el.classList.contains('is-done')) return;
      el.classList.toggle('is-hot', id===hot);
    });
    requestAnimationFrame(tick);
  })();
}

/* ---------- MAP ("MI RUTA") ---------- */
function postaStatusLabel(st){
  if(st==='completed') return 'Completada';
  if(st==='pending_validation') return 'Esperando mentor';
  if(st==='current') return 'En curso';
  return 'Bloqueada';
}
function currentPostaId(team){
  for(var i=0;i<POSTAS.length;i++){ if(team.postas[POSTAS[i].id].status!=='completed') return POSTAS[i].id; }
  return null;
}
function countCompleted(team){ return POSTAS.filter(function(p){ return team.postas[p.id].status==='completed'; }).length; }

function renderMap(){
  var team = currentTeam();
  var completedCount = countCompleted(team);
  var pct = Math.round((completedCount/POSTAS.length)*100);
  var tabsHtml = '<div class="tabs">' +
    '<button class="tab '+(state.tab==='mapa'?'active':'')+'" data-tab="mapa">Mi ruta</button>' +

  '</div>';

  var body;

    body = renderTeamDashboardInner(team);
  } else {
    var trail = POSTAS.map(function(p){
      var st = team.postas[p.id].status;
      var cls = st==='completed' ? 'completed' : (st==='pending_validation' ? 'pending' : (st==='current' ? 'current' : 'locked'));
      var clickable = (st!=='locked');

      if(st==='pending_validation'){ var ar=activeRequestFor(team.id,p.id); if(ar && ar.status==='claimed') subLabel='Mentor en camino'; }
      if(st==='current' && team.lastRejection && team.lastRejection[p.id]) subLabel='No aprobada · corregir';
      var node = st==='completed' ? '✓' : p.icon;
      return '<div class="stop '+cls+'">' +
        '<button class="stop-btn" '+(clickable?'data-posta="'+p.id+'"':'disabled')+'>' +
          '<div class="stop-node">'+node+'</div>' +

      '<p style="font-size:.8rem;opacity:.65;margin-top:6px;">'+completedCount+' de '+POSTAS.length+' postas completadas</p>' +
      '<div class="trail">'+trail+'</div>';

function renderTeamDashboardInner(team){
  var lines = POSTAS.map(function(p){
    var st = team.postas[p.id].status;
    var icon = st==='completed'?'✅':(st==='pending_validation'||st==='current'?'🟠':'🔒');
    var extra='';
    if(p.id==='p2' && team.postas.p2.count) extra=' — '+team.postas.p2.count+' respuestas';
    if(p.id==='p5' && team.postas.p5.count) extra=' — '+team.postas.p5.count+'/15 respuestas';
    return '<div class="stat-line"><span class="badge">'+icon+'</span><span>'+p.title+extra+'</span></div>';

  var history = hv.sort(function(a,b){return a.v.ts-b.v.ts;}).map(function(h){
    var v=h.v;
    if(!h.ok) return '<div class="history-item">Posta '+POSTA_BY_ID[v.postaId].num+' — '+esc(v.postaTitle)+' — <b style="color:var(--warning);">No aprobada</b> por '+esc(mentorDisplayName(v))+'<small>'+v.date+' · '+v.time+' · Motivo: "'+esc(v.reason)+'"</small></div>';
    return '<div class="history-item">Posta '+POSTA_BY_ID[v.postaId].num+' — '+esc(v.postaTitle)+' — Validada por '+esc(mentorDisplayName(v))+'<small>'+v.date+' · '+v.time+(v.observation?' · "'+esc(v.observation)+'"':'')+'</small></div>';
  });
  return '<div class="card">' +
    '<div style="font-family:var(--font-display);font-weight:700;font-size:1.1rem;margin-bottom:2px;">'+team.label+'</div>' +
    '<div style="font-size:.85rem;opacity:.7;margin-bottom:10px;">Misión: '+(team.mission?esc(team.mission.name):'—')+'</div>' +
    lines.join('') +
  '</div>' +
  '<div class="card"><b style="font-size:.8rem;text-transform:uppercase;opacity:.6;">Historial de validaciones</b>' +
    (history.length ? history.join('') : '<div class="history-item" style="opacity:.6;">Todavía no hay postas validadas.</div>') +
  '</div>';
}

/* Núcleo de aprobación: mismo registro que la V2 (historial, KPIs y reaperturas siguen igual). */
function approvePostaCore(teamId, postaId, mentor, obs, reqId){
  var team=loadTeam(teamId);
  var now=new Date();
  var verdictVal = (postaId==='p2'||postaId==='p5') ? (team.postas[postaId].verdict||'ok') : null;
  var record={
    postaId:postaId, postaTitle:POSTA_BY_ID[postaId].title,
    team:team.id, teamLabel:team.label, mission:team.mission?team.mission.name:'',
    mentorId:mentor.id, mentorName:mentor.name,
    date:now.toLocaleDateString('es-AR'), time:now.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}),
    ts:now.getTime(), observation:obs, verdict:verdictVal, reqId:reqId||null
  };
  team.validations = team.validations || [];
  team.validations.push(record);
  team.postas[postaId].status='completed';
  if(team.pendingRework && team.pendingRework.postaId===postaId){ team.pendingRework=null; }
  if(team.lastRejection) delete team.lastRejection[postaId];
  var nid=nextPostaId(postaId); var nextTitle=null;
  if(nid){ activatePosta(team,nid); nextTitle=POSTA_BY_ID[nid].title; }
  saveTeam(team);
  return nextTitle;
}
function rejectPostaCore(teamId, postaId, mentor, reason, reqId){
  var team=loadTeam(teamId);
  var now=new Date();
  var rec={
    postaId:postaId, postaTitle:POSTA_BY_ID[postaId].title,
    team:team.id, teamLabel:team.label, mission:team.mission?team.mission.name:'',
    mentorId:mentor.id, mentorName:mentor.name,
    date:now.toLocaleDateString('es-AR'), time:now.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}),
    ts:now.getTime(), reason:reason, reqId:reqId||null
  };
  team.rejections = team.rejections || [];
  team.rejections.push(rec);
  team.lastRejection = team.lastRejection || {};
  team.lastRejection[postaId] = rec;
  team.postas[postaId].status='current';
  team.pendingRework={postaId:postaId, reason:'no aprobada por mentor', ts:now.getTime()};
  saveTeam(team);
}

function requestP2(){
  var team=captureDraftFields('p2'); var d=team.postas.p2;
  var count=parseInt(d.count||0,10)||0;
  var missing2=[];
  if(!d.verdict) missing2.push('Debe indicar si el problema quedó validado, necesita ajustes o no fue validado.');
  var remaining=Math.max(0,15-count);
  if(remaining>0) missing2.push('Faltan '+remaining+' validaciones (llevás '+count+'/15).');
  if(!d.link) missing2.push('Falta cargar el link al formulario.');
  if(!d.l1) missing2.push('Falta completar "Lo que más se repitió fue…".');
  if(!d.l2) missing2.push('Falta completar "Algo que no esperábamos encontrar fue…".');
  if(!d.l3) missing2.push('Falta completar "Después de escuchar a las personas entendimos que…".');
  if(d.verdict==='ajustar' && !d.adjustedProblem) missing2.push('Falta la formulación ajustada del problema.');
  if(missing2.length){ saveTeam(team); state.notice=missingNotice(missing2); render(); return; }

  if(d.verdict==='no'){
    activatePosta(team,'p1');
    team.postas.p2.status='locked';
    team.postas.p2.count=''; team.postas.p2.link=''; team.postas.p2.evidence='';
    team.postas.p2.l1=''; team.postas.p2.l2=''; team.postas.p2.l3='';
    team.postas.p2.verdict=''; team.postas.p2.adjustedProblem='';
    team.pendingRework={postaId:'p1', reason:'problema no validado', ts:Date.now()};
    saveTeam(team);
    go('posta', {postaId:'p1', notice:'La evidencia mostró que el problema no era el correcto. Redefinan el problema y después vuelvan a validarlo con nueva evidencia.'});
    return;
  }
  if(d.verdict==='ajustar'){
    team.postas.p1.problem = d.adjustedProblem;
  }
  submitForValidation(team,'p2');
}

function publicStatus(team){

  var cur=currentPostaId(team); var st=team.postas[cur].status;
  if(st==='pending_validation') return 'Esperando mentor';
  if(postaHasDraft(team,cur)) return 'En trabajo';

}
function postaHasDraft(team,pid){
  var d=team.postas[pid];
  if(pid==='p1') return !!(d.q1||d.q2||d.q3||d.problem);
  if(pid==='p2') return !!(d.count||d.link||d.l1);
  if(pid==='p3') return !!d.challenge;
  if(pid==='p4') return !!(d.solName || (d.ideas||[]).some(function(x){return x;}));
  if(pid==='p5') return !!(d.count||d.link);
  if(pid==='p6') return !!(d.type||d.shows);
  if(pid==='p7') return !!(d.problem||d.solution);
  return false;
}
function lastMentorFor(team){

function lastMentorIdFor(team){

  if(key==='val2'){ if(d.p5.status==='completed') return pill('ok','Validado'); if(d.p5.status==='pending_validation') return pill('alert','Esperando mentor'); var c2=parseInt(d.p5.count||0,10)||0; if(c2>0) return pill('mid',c2+'/15'); return d.p5.status==='current'?pill('mid','En curso'):pill('no','—'); }

  if(key==='pitch'){ if(d.p7.status==='completed') return pill('ok','Listo'); if(d.p7.status==='pending_validation') return pill('alert','Esperando mentor'); return d.p7.status==='current'?pill('mid','En curso'):pill('no','—'); }

function isWaiting(team){ return POSTAS.some(function(p){ return team.postas[p.id].status==='pending_validation'; }); }

var STALL_MINUTES = 15;
var CLAIM_STALL_MINUTES = 10;
function minutesAgo(ts){ if(!ts) return null; return Math.floor((Date.now()-ts)/60000); }
function formatMinutes(mins){
  if(mins===null||mins===undefined) return '—';
  if(mins<1) return 'recién';
  if(mins<60) return mins+' min';
  var h=Math.floor(mins/60), m=mins%60;
  return h+'h '+m+'min';
}
function formatTimestamp(ts){
  if(!ts) return '—';
  var d=new Date(ts);

}

/* Single source of truth for "estado actual" — used identically by the
   private panel and the public board so they can never contradict each other. */
function estadoActual(team){
  if(!team.mission) return {key:'sin_iniciar', label:'Sin misión / Sin iniciar', icon:'⚪'};
  if(countCompleted(team)===7) return {key:'finalizado', label:'Finalizado', icon:'🏁'};
  var cur=currentPostaId(team);
  if(team.postas[cur].status==='pending_validation'){
    var ar=activeRequestFor(team.id,cur);
    if(ar && ar.status==='claimed') return {key:'esperando', label:'Mentor validando', icon:'🟠'};
    return {key:'esperando', label:'Esperando mentor', icon:'🟠'};
  }
  if(team.pendingRework && team.pendingRework.postaId===cur) return {key:'reformulando', label:'Reformulando', icon:'🔄'};
  return {key:'proceso', label:'En proceso', icon:'🔵'};
}
function estadoPillClass(key){
  if(key==='finalizado') return 'ok';
  if(key==='esperando') return 'esperando';
  if(key==='reformulando') return 'alert';
  if(key==='proceso') return 'proceso';
  return 'no';
}
/* Separate from "estado actual": the outcome of the team's most recent
   validation checkpoint (independent of what they're doing right now). */
function ultimaValidacion(team){
  if(team.pendingRework){ return {key:'requiere', label:'Requiere reformulación', mentor:null, obs:null, when:null}; }
  var recs=(team.validations||[]).slice().sort(function(a,b){return b.ts-a.ts;});
  if(!recs.length) return {key:'sin', label:'Sin validación', mentor:null, obs:null, when:null};
  var v=recs[0];
  var label = v.verdict==='ajustar' ? 'Aprobada con ajustes' : 'Aprobada';
  return {key: v.verdict==='ajustar'?'ajustes':'aprobada', label:label, mentor:mentorDisplayName(v), obs:v.observation, when:v.date+' · '+v.time};
}
function timeInCurrentPosta(team){
  var cur=currentPostaId(team);
  if(!cur) return null;
  return minutesAgo(team.postas[cur].enteredAt);
}
function attentionItems(teams){
  var items=[];
  teams.forEach(function(t){
    if(!t.mission) return;
    var finished = countCompleted(t)===7;
    if(finished) return;
    if(isWaiting(t)){
      var ar=activeRequestForTeam(t.id);
      if(ar && ar.status==='claimed'){
        var mins=minutesAgo(ar.claimedAt), mm=mentorById(ar.claimedBy);
        if(mins>=CLAIM_STALL_MINUTES) items.push({priority:2, team:t, text:t.label+' — P'+POSTA_BY_ID[ar.postaId].num+': '+(mm?mentorFullName(mm):'mentor')+' validando hace '+formatMinutes(mins)});
        return;
      }
      var since = ar ? ar.createdAt : t.lastActivityAt;
      items.push({priority:1, team:t, text:t.label+' — '+(ar?'P'+POSTA_BY_ID[ar.postaId].num+': ':'')+'solicitud sin tomar hace '+formatMinutes(minutesAgo(since))});
      return;
    }
    if(!hasActivity(t)){
      items.push({priority:2, team:t, text:t.label+' — sin actividad registrada'});
      return;
    }
    var idle=minutesAgo(t.lastActivityAt);
    if(idle!==null && idle>=STALL_MINUTES){
      items.push({priority:3, team:t, text:t.label+' — sin actividad hace '+formatMinutes(idle)});
    }
  });
  items.sort(function(a,b){return a.priority-b.priority;});
  return items;
}
function secondaryCounts(teams){
  return {
    reformulando: teams.filter(function(t){ return t.mission && estadoActual(t).key==='reformulando'; }).length,
    porFinalizar: teams.filter(function(t){ return countCompleted(t)>=6 && countCompleted(t)<7; }).length
  };

function renderMentorActivity(teams){
  var mentors=loadMentors();
  var allValidations=[], allRejections=[];
  teams.forEach(function(t){ (t.validations||[]).forEach(function(v){ allValidations.push(v); }); (t.rejections||[]).forEach(function(v){ allRejections.push(v); }); });
  var reqsAll=loadRequests();

  var cards = mentors.map(function(m){
    var mine = allValidations.filter(function(v){ return v.mentorId===m.id; });
    var mineRej = allRejections.filter(function(v){ return v.mentorId===m.id; });
    var both = mine.concat(mineRej);
    var grupos = both.reduce(function(acc,v){ if(acc.indexOf(v.teamLabel)===-1) acc.push(v.teamLabel); return acc; }, []);
    var lastTs = both.length ? Math.max.apply(null, both.map(function(v){return v.ts;})) : null;
    var claimed = reqsAll.filter(function(r){ return r.claimedBy===m.id && r.claimedAt; });
    var avgResp = claimed.length ? Math.round(claimed.reduce(function(s2,r){ return s2+(r.claimedAt-r.createdAt); },0)/claimed.length/60000) : null;
    var extra=[m.specialty,m.org].filter(Boolean).join(' · ');
    return '<div class="card" style="margin-bottom:10px;">' +
      '<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;">' +
        '<div><b>'+esc(mentorFullName(m))+'</b>'+(extra?'<div style="font-size:.78rem;opacity:.65;">'+esc(extra)+'</div>':'')+'</div>' +
        estadoPillForMentor(m) +
      '</div>' +
      '<div style="display:flex; gap:22px; flex-wrap:wrap; margin-top:12px; font-size:.85rem;">' +
        '<div><b style="font-family:var(--font-display);font-size:1.2rem;">'+mine.length+'</b><br><span style="opacity:.65;font-size:.75rem;">aprobadas</span></div>' +
        '<div><b style="font-family:var(--font-display);font-size:1.2rem;">'+mineRej.length+'</b><br><span style="opacity:.65;font-size:.75rem;">no aprobadas</span></div>' +
        '<div><b style="font-family:var(--font-display);font-size:1.2rem;">'+grupos.length+'</b><br><span style="opacity:.65;font-size:.75rem;">grupos distintos</span></div>' +
        '<div><b style="font-family:var(--font-display);font-size:1.2rem;">'+formatMinutes(avgResp)+'</b><br><span style="opacity:.65;font-size:.75rem;">respuesta promedio</span></div>' +
        '<div><b style="font-family:var(--font-display);font-size:1.2rem;">'+formatTimestamp(lastTs)+'</b><br><span style="opacity:.65;font-size:.75rem;">última actividad</span></div>' +
      '</div>' +
    '</div>';
  }).join('');

  var f=state.activityFilters;
  var filtered = allValidations.map(function(v){ v._ok=true; return v; }).concat(allRejections.map(function(v){ v._ok=false; return v; })).filter(function(v){
    if(f.mentor && v.mentorId!==f.mentor) return false;
    if(f.team && v.team!==f.team) return false;
    if(f.posta && v.postaId!==f.posta) return false;
    return true;
  }).sort(function(a,b){ return b.ts-a.ts; });

  var mentorOpts = mentors.map(function(m){ return '<option value="'+m.id+'" '+(f.mentor===m.id?'selected':'')+'>'+esc(mentorFullName(m))+'</option>'; }).join('');
  var teamOpts = TEAM_IDS.map(function(id){ return '<option value="'+id+'" '+(f.team===id?'selected':'')+'>'+teamLabel(id)+'</option>'; }).join('');
  var postaOpts = POSTAS.map(function(p){ return '<option value="'+p.id+'" '+(f.posta===p.id?'selected':'')+'>'+p.title+'</option>'; }).join('');

  var logRows = filtered.map(function(v){
    var resLabel = !v._ok ? pill('alert','No aprobada') : (v.verdict==='ajustar' ? 'Aprobada con ajustes' : 'Aprobada');
    var obsTxt = !v._ok ? ('Motivo: '+v.reason) : v.observation;
    return '<tr><td>'+esc(mentorDisplayName(v))+'</td><td>'+esc(v.teamLabel)+'</td><td>'+esc(v.mission||'—')+'</td><td>'+esc(v.postaTitle)+'</td><td>'+resLabel+'</td>' +
      '<td style="white-space:normal;font-size:.78rem;max-width:220px;">'+(obsTxt?esc(obsTxt):'—')+'</td><td>'+v.date+' · '+v.time+'</td></tr>';
  }).join('');

  return '<p style="opacity:.7;font-size:.85rem;">Mentorías registradas — uso interno del equipo organizador.</p>' +
    cards +
    '<div class="filters" style="margin-top:20px;">' +
      '<select data-activity-filter="mentor"><option value="">Todos los mentores</option>'+mentorOpts+'</select>' +
      '<select data-activity-filter="team"><option value="">Todos los grupos</option>'+teamOpts+'</select>' +
      '<select data-activity-filter="posta"><option value="">Todas las postas</option>'+postaOpts+'</select>' +
    '</div>' +
    '<div class="admin-table-wrap"><table>' +
      '<thead><tr><th>Mentor</th><th>Grupo</th><th>Misión</th><th>Posta</th><th>Resultado</th><th>Observación / motivo</th><th>Fecha/hora</th></tr></thead>' +
      '<tbody>'+(logRows||'<tr><td colspan="7" style="opacity:.6;">Todavía no hay validaciones registradas.</td></tr>')+'</tbody>' +
    '</table></div>';
}

function reopenPosta(teamId,postaId){
  var idx=POSTA_INDEX[postaId];
  cancelTeamRequests(teamId, idx);
  var team=loadTeam(teamId);
  POSTAS.forEach(function(p,i){
    if(i===idx) activatePosta(team,p.id);
    else if(i>idx) team.postas[p.id].status='locked';
  });
  team.validations=(team.validations||[]).filter(function(v){ return POSTA_INDEX[v.postaId] < idx; });
  team.pendingRework=null;
  saveTeam(team); render();
}

function claimRequest(reqId){
  var me=currentMentor(); if(!me) return;
  if(me.estado!=='disponible' || myClaimedRequest()){ state.mentorNotice='Para aceptar tenés que estar disponible y sin otra validación en curso.'; render(); return; }
  var fresh=loadRequests().filter(function(r){ return r.id===reqId; })[0];
  if(!fresh || fresh.status!=='open'){
    var om = fresh && fresh.claimedBy ? mentorById(fresh.claimedBy) : null;
    state.mentorNotice = om ? ('Ya la tomó '+mentorFullName(om)+'.') : 'Esa solicitud ya no está disponible.';
    render(); return;
  }
  updateRequest(reqId, function(r){ r.status='claimed'; r.claimedBy=me.id; r.claimedAt=Date.now(); });
  var tEl=document.getElementById('toast'); if(tEl) tEl.hidden=true; document.title=baseTitle;
  setMentorEstadoRaw(me.id,'ocupado');
  state.mentorNotice=''; state.showReject=false; state.mentorReviewId=reqId; render(); window.scrollTo(0,0);
}
function claimConsulta(id){
  var me=currentMentor(); if(!me) return;
  if(me.estado!=='disponible' || myClaimedRequest() || myClaimedConsulta()){ state.mentorNotice='Para aceptar tenés que estar disponible y sin otra atención en curso.'; render(); return; }
  var fresh=loadConsultas().filter(function(c){ return c.id===id; })[0];
  if(!fresh || fresh.status!=='open' || fresh.mentorId!==me.id){ state.mentorNotice='Esa consulta ya no está disponible.'; render(); return; }
  updateConsulta(id, function(c){ c.status='claimed'; c.claimedAt=Date.now(); });
  var tEl=document.getElementById('toast'); if(tEl) tEl.hidden=true; document.title=baseTitle;
  setMentorEstadoRaw(me.id,'ocupado');
  state.mentorNotice=''; render(); window.scrollTo(0,0);
}
function finishConsulta(id){
  var me=currentMentor(); if(!me) return;
  updateConsulta(id, function(c){ if(c.status==='claimed' && c.mentorId===me.id){ c.status='done'; c.resolvedAt=Date.now(); } });
  freeMentorIfBusy(me.id);
  state.mentorNotice='Consulta finalizada. Volviste a estar disponible.'; render();
}
function releaseRequest(reqId){
  var me=currentMentor(); if(!me) return;
  updateRequest(reqId, function(r){ if(r.status==='claimed' && r.claimedBy===me.id){ r.status='open'; r.claimedBy=null; r.claimedAt=null; } });
  setMentorEstadoRaw(me.id,'disponible');
  state.mentorReviewId=null; state.showReject=false; state.mentorNotice='Solicitud devuelta a pendientes.'; render();
}
function finishMentorReq(reqId, me, fields){
  updateRequest(reqId, function(r){ Object.assign(r, fields); r.resolvedAt=Date.now(); });
  var m=mentorById(me.id); if(m && m.estado==='ocupado') setMentorEstadoRaw(me.id,'disponible');
  state.mentorReviewId=null; state.showReject=false;
}
function approveRequest(reqId){
  var me=currentMentor(); if(!me) return;
  var r=loadRequests().filter(function(x){ return x.id===reqId; })[0];
  if(!r || r.status!=='claimed' || r.claimedBy!==me.id){ state.mentorNotice='Esta solicitud ya no está a tu cargo.'; state.mentorReviewId=null; render(); return; }
  var obs=getVal('mObs','').trim();
  var nextTitle=approvePostaCore(r.teamId, r.postaId, me, obs, r.id);
  finishMentorReq(reqId, me, {status:'approved', observation:obs});
  state.mentorNotice='Aprobada: '+r.teamLabel+' · Posta '+POSTA_BY_ID[r.postaId].num+(nextTitle?(' — se desbloqueó '+nextTitle+'.'):' — ¡recorrido completo!');
  render(); window.scrollTo(0,0);
}
function rejectRequest(reqId){
  var me=currentMentor(); if(!me) return;
  var r=loadRequests().filter(function(x){ return x.id===reqId; })[0];
  if(!r || r.status!=='claimed' || r.claimedBy!==me.id){ state.mentorNotice='Esta solicitud ya no está a tu cargo.'; state.mentorReviewId=null; render(); return; }
  var reason=getVal('mReason','').trim();
  if(!reason){ state.mentorNotice='Escribí el motivo: el grupo lo necesita para corregir la posta.'; softRender(); return; }
  rejectPostaCore(r.teamId, r.postaId, me, reason, r.id);
  finishMentorReq(reqId, me, {status:'rejected', reason:reason});
  state.mentorNotice='No aprobada: '+r.teamLabel+' · Posta '+POSTA_BY_ID[r.postaId].num+'. El grupo ya ve el motivo y puede volver a solicitar.';
  render(); window.scrollTo(0,0);
}
function setMyEstado(estado){

/* Alertas: aviso visual + sonido (el navegador exige un toque previo para habilitar audio). */
var audioCtx=null, toastTimer=null, baseTitle=document.title;
function enableAlerts(){
  try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.resume) audioCtx.resume(); }catch(e){ audioCtx=null; }
  state.alertsOn=true; beep(); render();
}
function beep(){
  if(!audioCtx) return;
  try{
    [0,0.18].forEach(function(off,i){
      var o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='sine'; o.frequency.value = i ? 1046 : 784;
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime+off);
      g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+off+0.16);
      o.connect(g); g.connect(audioCtx.destination); o.start(audioCtx.currentTime+off); o.stop(audioCtx.currentTime+off+0.18);
    });
  }catch(e){}
}
function showToast(text){
  var el=document.getElementById('toast'); if(!el) return;
  el.textContent=text; el.hidden=false;
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ el.hidden=true; document.title=baseTitle; }, 6000);
}
function checkMentorAlerts(){
  if(state.screen!=='mentor' || !state.mentorId) return;
  var open=loadRequests().filter(function(r){ return r.status==='open'; });
  var ids=open.map(function(r){ return r.id; });
  if(state.seenReqIds===null){ state.seenReqIds=ids; return; }
  var fresh=open.filter(function(r){ return state.seenReqIds.indexOf(r.id)===-1; });
  state.seenReqIds=ids;
  var me=currentMentor();
  if(fresh.length && me && me.estado==='disponible'){
    var r=fresh[fresh.length-1];
    showToast('🔔 Nueva solicitud: '+r.teamLabel+' · Posta '+POSTA_BY_ID[r.postaId].num+' — '+POSTA_BY_ID[r.postaId].title);
    document.title='('+open.length+') Solicitud de validación';
    if(state.alertsOn) beep();
  }
  var oc=loadConsultas().filter(function(c){ return c.status==='open' && c.mentorId===state.mentorId; });
  var cids=oc.map(function(c){ return c.id; });
  if(state.seenConsIds===null){ state.seenConsIds=cids; return; }
  var freshC=oc.filter(function(c){ return state.seenConsIds.indexOf(c.id)===-1; });
  state.seenConsIds=cids;
  if(freshC.length && me && me.estado==='disponible'){
    showToast('🔔 Consulta: te llama '+freshC[freshC.length-1].teamLabel);
    document.title='('+oc.length+') Consulta de un grupo';
    if(state.alertsOn) beep();
  }
}

function laneNodes(team){
  var cur = currentPostaId(team);
  var nodes = [];
  nodes.push({label:'🏁', state: team.mission ? 'done' : 'pending'});
  POSTAS.forEach(function(p){
    var st=team.postas[p.id].status; var s;
    if(st==='completed') s='done';
    else if(p.id===cur) s = (st==='pending_validation') ? 'waiting' : 'current';
    else s='pending';
    nodes.push({label:String(p.num), state:s});
  });
  nodes.push({label:'🏆', state: cur ? 'pending' : 'done'});
  return nodes;
}
