function afterRender(){
  var app=document.getElementById('app');
  app.onclick=function(e){
    var el;
    el=e.target.closest('[data-nav]'); if(el){ e.preventDefault(); go(el.getAttribute('data-nav')); return; }
    var act=e.target.closest('[data-action]'); var an=act?act.getAttribute('data-action'):'';
    if(act && act.disabled) return;
    if(an==='startDraw'){ startDraw(); return; }
    if(an==='startGroup'){ startGroup(); return; }
    if(an==='continueGroup'){ continueGroup(); return; }
    if(an==='submitCardCode'){ submitCardCode(); return; }
    if(an==='closeCardCode'){ closeCardCode(); return; }
    if(an==='submitGroupCode'){ submitGroupCode(); return; }
    if(an==='groupLogout'){ groupLogout(); return; }
    if(an==='saveGroupCode'){ saveGroupCode(act.getAttribute('data-group')); return; }
    if(an==='closeGroupAccess'){ closeGroupAccess(act.getAttribute('data-group')); return; }
    if(an==='askResetGroup'){ state.confirmResetGroupId=act.getAttribute('data-group'); state.accessNotice=''; render(); return; }
    if(an==='cancelResetGroup'){ state.confirmResetGroupId=null; render(); return; }
    if(an==='confirmResetGroup'){ resetGroup(act.getAttribute('data-group')); return; }
    if(an==='saveAppUrl'){ saveAppUrl(); return; }
    if(an==='copyQrUrl'){ copyQrUrl(); return; }
    if(an==='undoTurn'){ undoTurn(); return; }
    if(an==='confirmStageTeam'){ confirmStageTeam(act.getAttribute('data-stage-team')); return; }
    if(an==='goRouteFromStage'){ goRouteFromStage(act.getAttribute('data-stage-team')); return; }
    if(an==='openMentorGate'){ e.preventDefault(); openMentorGate(); return; }
    if(an==='closeMentorGate'){ closeMentorGate(); return; }
    if(an==='submitMentorPin'){ submitMentorPin(); return; }
    if(an==='mentorLogout'){ mentorLogout(); return; }
    if(an==='claimRequest'){ claimRequest(act.getAttribute('data-req')); return; }
    if(an==='openConsult'){ openConsult(); return; }
    if(an==='closeConsult'){ closeConsult(); return; }
    if(an==='callMentor'){ callMentor(act.getAttribute('data-mentor-id')); return; }
    if(an==='cancelConsult'){ cancelConsult(); return; }
    if(an==='finishConsultGroup'){ finishConsultGroup(); return; }
    if(an==='claimConsulta'){ claimConsulta(act.getAttribute('data-cons')); return; }
    if(an==='finishConsulta'){ finishConsulta(act.getAttribute('data-cons')); return; }
    if(an==='openReview'){ state.mentorReviewId=act.getAttribute('data-req'); state.showReject=false; state.mentorNotice=''; render(); window.scrollTo(0,0); return; }
    if(an==='backToRequests'){ e.preventDefault(); state.mentorReviewId=null; state.showReject=false; render(); return; }
    if(an==='approveRequest'){ approveRequest(act.getAttribute('data-req')); return; }
    if(an==='rejectRequest'){ rejectRequest(act.getAttribute('data-req')); return; }
    if(an==='toggleReject'){ state.showReject=!state.showReject; state.mentorNotice=''; render(); return; }
    if(an==='releaseRequest'){ e.preventDefault(); releaseRequest(act.getAttribute('data-req')); return; }
    if(an==='setMyEstado'){ setMyEstado(act.getAttribute('data-estado')); return; }
    if(an==='enableAlerts'){ enableAlerts(); return; }
    if(an==='cancelRequest'){ cancelRequest(act.getAttribute('data-posta-id')); return; }
    if(an==='resendRequest'){ resendRequest(act.getAttribute('data-posta-id')); return; }
    el=e.target.closest('[data-mtab]'); if(el){ state.mentorTab=el.getAttribute('data-mtab'); state.mentorNotice=''; render(); return; }
    el=e.target.closest('[data-team]'); if(el){ openCardCode(el.getAttribute('data-team')); return; }
    el=e.target.closest('#spinBtn'); if(el && !el.disabled){ spinWheel(); return; }
    el=e.target.closest('[data-action="acceptMission"]'); if(el){ acceptMission(); return; }
    el=e.target.closest('[data-tab]'); if(el){ state.tab=el.getAttribute('data-tab'); render(); return; }
    el=e.target.closest('[data-admintab]'); if(el){ state.accessNotice=''; state.confirmResetGroupId=null; state.adminTab=el.getAttribute('data-admintab'); state.editingMentorId=null; state.confirmDeleteMentorId=null; state.showAddMentorForm=false; render(); return; }
    el=e.target.closest('[data-posta]'); if(el){ openPosta(el.getAttribute('data-posta')); return; }
    el=e.target.closest('[data-verdict]'); if(el){ setVerdict(el.getAttribute('data-verdict-for'), el.getAttribute('data-verdict')); return; }
    el=e.target.closest('[data-action="openForm"]'); if(el && !el.disabled){ openForm(); return; }
    el=e.target.closest('[data-action="closeGuideForm"]'); if(el){ closeGuideForm(); return; }
    el=e.target.closest('[data-action="openOrgGate"]'); if(el){ e.preventDefault(); openOrgGate(); return; }
    el=e.target.closest('[data-action="closeOrgGate"]'); if(el){ closeOrgGate(); return; }
    el=e.target.closest('[data-action="submitOrgPin"]'); if(el){ submitOrgPin(); return; }
    el=e.target.closest('[data-action="requestP1"]'); if(el){ requestP1(); return; }
    el=e.target.closest('[data-action="requestP2"]'); if(el){ requestP2(); return; }
    el=e.target.closest('[data-action="requestP3"]'); if(el){ requestP3(); return; }
    el=e.target.closest('[data-action="requestP4"]'); if(el){ requestP4(); return; }
    el=e.target.closest('[data-action="requestP5"]'); if(el){ requestP5(); return; }
    el=e.target.closest('[data-action="requestP6"]'); if(el){ requestP6(); return; }
    el=e.target.closest('[data-action="requestP7"]'); if(el){ requestP7(); return; }
    el=e.target.closest('[data-action="continueAfterConfirm"]'); if(el){ continueAfterConfirm(); return; }
    el=e.target.closest('[data-detail]'); if(el){ openAdminDetail(el.getAttribute('data-detail')); return; }
    el=e.target.closest('[data-action="closeAdminDetail"]'); if(el){ closeAdminDetail(); return; }
    el=e.target.closest('[data-reopen]'); if(el){ var parts=el.getAttribute('data-reopen').split('|'); reopenPosta(parts[0],parts[1]); return; }
    el=e.target.closest('[data-action="editMentor"]'); if(el){ editMentor(el.getAttribute('data-mentor-id')); return; }
    el=e.target.closest('[data-action="cancelMentorEdit"]'); if(el){ cancelMentorEdit(); return; }
    el=e.target.closest('[data-action="saveMentorEdit"]'); if(el){ saveMentorEdit(el.getAttribute('data-mentor-id')); return; }
    el=e.target.closest('[data-action="askDeleteMentor"]'); if(el){ askDeleteMentor(el.getAttribute('data-mentor-id')); return; }
    el=e.target.closest('[data-action="cancelDeleteMentor"]'); if(el){ cancelDeleteMentor(); return; }
    el=e.target.closest('[data-action="confirmDeleteMentor"]'); if(el){ confirmDeleteMentor(el.getAttribute('data-mentor-id')); return; }
    el=e.target.closest('[data-action="openAddMentorForm"]'); if(el){ openAddMentorForm(); return; }
    el=e.target.closest('[data-action="cancelAddMentor"]'); if(el){ cancelAddMentor(); return; }
    el=e.target.closest('[data-action="addMentor"]'); if(el){ addMentor(); return; }
    el=e.target.closest('[data-action="saveOrgPinConfig"]'); if(el){ saveOrgPinConfig(); return; }
    el=e.target.closest('[data-action="askResetAll"]'); if(el){ askResetAll(); return; }
    el=e.target.closest('[data-action="cancelResetAll"]'); if(el){ cancelResetAll(); return; }
    el=e.target.closest('[data-action="confirmResetAll"]'); if(el){ confirmResetAll(); return; }
    el=e.target.closest('[data-action="filterEstado"]'); if(el){ filterEstado(el.getAttribute('data-estado-key')); return; }
    if(e.target.classList.contains('modal-overlay')){
      if(e.target.getAttribute('data-close-guide')) closeGuideForm();
      if(e.target.getAttribute('data-close-admin')) closeAdminDetail();
      if(e.target.getAttribute('data-close-org')) closeOrgGate();
      if(e.target.getAttribute('data-close-mentor')) closeMentorGate();
      if(e.target.getAttribute('data-close-cardcode')) closeCardCode();
    }
  };
  app.onchange=function(e){
    var el=e.target.closest('[data-filter]');
    if(el){ setAdminFilter(el.getAttribute('data-filter'), el.value); return; }
    el=e.target.closest('[data-activity-filter]');
    if(el){ setActivityFilter(el.getAttribute('data-activity-filter'), el.value); return; }
  };
  runDrawAnimation();
  checkMentorAlerts();
  if(state.screen==='wheel' && !state.remoteSpin) setTimeout(maybeRemoteSpin, 0);
  var gc=document.getElementById('groupCode');
  if(gc){ gc.onkeydown=function(ev){ if(ev.key==='Enter'){ ev.preventDefault(); submitGroupCode(); } }; }
  var cc=document.getElementById('cardCode');
  if(cc){ cc.onkeydown=function(ev){ if(ev.key==='Enter'){ ev.preventDefault(); submitCardCode(); } }; }
  app.oninput=function(e){
    if(e.target.id==='p2count') updateLiveProgress('p2', e.target.value);
    if(e.target.id==='p5count') updateLiveProgress('p5', e.target.value);
  };
}

/* ---------- INIT / HASH ROUTING (staff access) ---------- */
function boot(){
  var hash = (window.location.hash || '').replace('#','');
  var savedMentor=null; try{ savedMentor=sessionStorage.getItem(MENTOR_SESSION_KEY); }catch(e){}
  if(hash === 'admin') state.showOrgGate=true;
  else if(hash === 'public') state.screen='public';
  else if(hash === 'ruleta') state.screen='wheel';
  else if(hash === 'grupo'){
    var gsB=readStoredSession('tab');
    if(groupSessionValid(gsB)){ state.groupMode=gsB.teamId; state.teamId=gsB.teamId; state.screen = loadTeam(gsB.teamId).mission ? 'map' : 'wheel'; }
    else state.screen='groupEntry';
  }
  else if(savedMentor && mentorById(savedMentor)){ state.screen='mentor'; state.mentorId=savedMentor; }
  else if(hash === 'mentor') state.showMentorGate=true;

  state.spunKey = spinKey(loadGame());
  render();
}
/* Con la sincronización activa, la primera pantalla espera (máx. 3,5 s) a
   tener el estado de la nube; sin ella arranca igual que siempre. */
syncStart(boot);

/* Actualizaciones en vivo: timers cada 5 s en las vistas de seguimiento y
   reacción a cambios hechos en otras pestañas del mismo navegador. */
setInterval(function(){
  if(state.screen==='admin' || state.screen==='public' || state.screen==='mentor'){ softRender(); }
  else if(state.screen==='posta'){ var t=currentTeam(); if(t && state.postaId && t.postas[state.postaId].status==='pending_validation') softRender(); }
}, 5000);
function sharedKeyNeedsRender(key){
  if(!key || key.indexOf(STORAGE_PREFIX)!==0) return false;
  if(key===MENTOR_SESSION_KEY || key===GROUP_SESSION_KEY) return false;
  var sc=state.screen;
  if(sc==='admin' || sc==='public' || sc==='mentor' || sc==='wheel' || sc==='login'){
    return !(sc==='admin' && state.adminTab==='accesos' && key===STORAGE_PREFIX+'app_url');
  }
  return (sc==='map' || sc==='posta') && (key===REQ_KEY || key===CONS_KEY || key===MENTORS_KEY || key===ACCESS_KEY || key===STORAGE_PREFIX+state.teamId);
}
/* Cambios hechos en otra pestaña del navegador o traídos de la nube. */
window.addEventListener('storage', function(e){ if(sharedKeyNeedsRender(e.key)) softRender(); });
sync.onChange = function(keys){ if(keys.some(sharedKeyNeedsRender)) softRender(); };
})();
</script>
