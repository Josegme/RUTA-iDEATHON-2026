<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RUTA IDEATHON 2026 — V2 (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-primary:#0D607C;
    --brand-secondary:#EF8F49;
    --brand-secondary-shadow:#B9692A;
    --brand-dark:#073A4B;
    --brand-light:#F4F7F8;
    --success:#2F8F5C;
    --warning:#C23B3B;
    --ink:#122A33;
    --paper:#FBFCFC;
    --paper-2:#EDF2F3;
    --line:#D2DCDE;
    --radius:14px;
    --font-display:'Space Grotesk',system-ui,-apple-system,sans-serif;
    --font-body:'Work Sans',system-ui,-apple-system,sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F3F1E7; --paper:#0E1712; --paper-2:#152420; --line:#2B3A34;
    }
    :root:not([data-theme="light"]) .stop.current .stop-btn{background:#2E2015;}
    :root:not([data-theme="light"]) .stop.pending .stop-btn{background:#331612;}
    :root:not([data-theme="light"]) .warn{background:#3A1611; color:#F2C7B4;}
    :root:not([data-theme="light"]) .notice{background:#3A2A11; color:#F5D9AE;}
    :root:not([data-theme="light"]) .info-box{background:#0E2A33; color:#BFE1EA;}
    :root:not([data-theme="light"]) .choice.selected{background:#0E2A33;}
    :root:not([data-theme="light"]) .pill.ok{background:#173028;}
    :root:not([data-theme="light"]) .pill.mid{background:#3A2E11;}
    :root:not([data-theme="light"]) .pill.alert{background:#3A1E12;}
    :root:not([data-theme="light"]) .attention-banner{background:#3A1611;}
    :root:not([data-theme="light"]) .chip-warn{background:#3A1611;}
    :root:not([data-theme="light"]) .chip-ok{background:#173028;}
    :root:not([data-theme="light"]) .pill.proceso{background:#0E2A33;}
    :root:not([data-theme="light"]) .pill.esperando{background:#3A2A11; color:#F0B87A;}
  }
  :root[data-theme="dark"]{ --ink:#F3F1E7; --paper:#0E1712; --paper-2:#152420; --line:#2B3A34; }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:var(--font-display);}
  a{color:inherit;}
  button{font-family:var(--font-body);cursor:pointer;}
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{ outline:3px solid var(--brand-secondary); outline-offset:2px; }
  #app{min-height:100%;}
  .screen{max-width:640px;margin:0 auto;padding:20px 18px 64px;}
  .wide{max-width:1120px;}

  .topbar{
    position:sticky; top:0; z-index:10; padding-top:calc(10px + env(safe-area-inset-top,0px));
    background:var(--brand-dark); color:var(--brand-light);
    display:flex; align-items:center; justify-content:space-between;
    padding-left:18px; padding-right:18px; padding-bottom:10px;
  }
  .topbar .tname{font-family:var(--font-display); font-weight:700; letter-spacing:.02em;}
  .topbar .tmission{font-size:.78rem; opacity:.8;}
  .topbar button{ background:transparent; border:1px solid rgba(243,241,231,.35); color:var(--brand-light); border-radius:20px; padding:6px 12px; font-size:.78rem; }

  .hero{padding-top:10vh;}
  .hero h1{font-size:clamp(2.2rem,8vw,3.2rem); line-height:1.02; margin:0 0 6px;}
  .hero .sub{font-family:var(--font-display); font-weight:600; color:var(--brand-primary); font-size:1.15rem; margin:0 0 22px;}
  .hero p.tagline{font-size:1.02rem; line-height:1.5; max-width:46ch; color:var(--ink); opacity:.85; margin:0 0 40px;}
  .btn{
    display:inline-flex; align-items:center; gap:8px; justify-content:center;
    background:var(--brand-secondary); color:#fff; border:none;
    font-weight:700; font-size:1rem; padding:15px 26px; border-radius:999px;
    box-shadow:0 6px 0 0 var(--brand-secondary-shadow); transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 0 var(--brand-secondary-shadow);}
  .btn.secondary{background:transparent; color:var(--brand-primary); border:2px solid var(--brand-primary); box-shadow:none; padding:13px 24px;}
  .btn.secondary:active{transform:translateY(2px);}
  .btn.ghost{background:transparent; box-shadow:none; color:var(--ink); border:1px solid var(--line); padding:12px 20px;}
  .btn.small{padding:8px 14px; font-size:.8rem; box-shadow:none;}
  .btn[disabled]{opacity:.4; box-shadow:none; cursor:not-allowed; transform:none;}
  .footnote{margin-top:56px; font-size:.78rem; color:var(--ink); opacity:.55;}

  .grid-teams{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:22px;}
  .team-card{ border:2px solid var(--line); border-radius:var(--radius); padding:18px 14px; background:var(--paper-2); text-align:left; font-family:var(--font-display); font-weight:600; font-size:1.05rem; }
  .team-card small{display:block; font-family:var(--font-body); font-weight:400; font-size:.72rem; opacity:.65; margin-top:4px;}
  .team-card.done{border-color:var(--success);}

  .wheel-wrap{display:flex; flex-direction:column; align-items:center; margin-top:18px;}
  .wheel-frame{position:relative; width:min(78vw,300px); height:min(78vw,300px);}
  .pointer{ position:absolute; top:-6px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:14px solid transparent; border-right:14px solid transparent; border-top:22px solid var(--brand-dark); z-index:3; }
  .wheel{ width:100%; height:100%; border-radius:50%; position:relative; border:6px solid var(--brand-dark); transition:transform 4.2s cubic-bezier(.17,.67,.16,1); box-shadow:0 10px 30px rgba(0,0,0,.18); }
  .wheel .slice-pin{ position:absolute; top:50%; left:50%; width:36%; height:0; transform-origin:0 50%; }
  .wheel .slice-icon{ position:absolute; right:0; top:0; display:inline-block; font-size:1.5rem; line-height:1; filter:drop-shadow(0 1px 2px rgba(0,0,0,.25)); }
  .wheel-hub{ position:absolute; top:50%; left:50%; width:22%; height:22%; transform:translate(-50%,-50%); background:var(--paper); border-radius:50%; border:4px solid var(--brand-dark); display:flex; align-items:center; justify-content:center; font-size:1.4rem; z-index:2; }
  .mission-result{ margin-top:26px; width:100%; background:var(--paper-2); border-radius:var(--radius); border:1px solid var(--line); padding:22px; text-align:center; }
  .mission-result .kicker{font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--brand-primary); font-weight:600;}
  .mission-result h2{font-size:1.6rem; margin:6px 0 14px;}
  .mission-result .field{text-align:left; margin:10px 0; font-size:.92rem;}
  .mission-result .field b{display:block; font-family:var(--font-display); font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink); opacity:.6; margin-bottom:2px;}

  .trail{position:relative; margin:20px 0 10px; padding-left:34px;}
  .trail::before{ content:''; position:absolute; left:15px; top:8px; bottom:8px; width:3px; background:repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 12px); }
  .stop{position:relative; margin-bottom:14px;}
  .stop-btn{ width:100%; text-align:left; display:flex; gap:14px; align-items:center; background:var(--paper-2); border:2px solid var(--line); border-radius:var(--radius); padding:14px 16px; position:relative; }
  .stop-node{ position:absolute; left:-34px; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:50%; background:var(--paper); border:3px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:1rem; }
  .stop.completed .stop-node{background:var(--success); border-color:var(--success); color:#fff;}
  .stop.current .stop-btn{border-color:var(--brand-secondary); background:#FFF1E4;}
  .stop.current .stop-node{background:var(--brand-secondary); border-color:var(--brand-secondary); color:#fff;}
  .stop.pending .stop-btn{border-color:var(--warning); background:#FCEAE6;}
  .stop.pending .stop-node{background:var(--warning); border-color:var(--warning); color:#fff;}
  .stop.locked .stop-btn{opacity:.5;}
  .stop-title{font-family:var(--font-display); font-weight:600; font-size:.95rem;}
  .stop-sub{font-size:.76rem; opacity:.65; margin-top:2px;}
  .stop-tagline{font-size:.74rem; opacity:.55; margin-top:1px; font-style:italic;}
  .stamp{margin-left:auto; font-size:.7rem; color:var(--success); font-weight:700; white-space:nowrap;}

  .posta-head{margin-bottom:20px;}
  .posta-eyebrow{
    display:inline-block; font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    color:#fff; background:var(--brand-primary); padding:6px 14px; border-radius:20px; margin-bottom:6px;
  }
  .posta-head h2{font-size:1.7rem; margin:6px 0 8px;}
  .posta-head p{opacity:.8; line-height:1.5; margin:0;}
  .card{background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px;}
  .warn{ background:#FBEAE3; border:1px solid var(--warning); color:#7A2213; border-radius:10px; padding:10px 14px; font-size:.85rem; font-weight:600; margin:14px 0; }
  .notice{ background:#FDE9D3; border:1px solid var(--brand-secondary); color:#7A4413; border-radius:10px; padding:10px 14px; font-size:.85rem; font-weight:600; margin:14px 0; }
  .info-box{ background:#E4EEF1; border:1px solid var(--brand-primary); color:#0D4A5F; border-radius:10px; padding:10px 14px; font-size:.85rem; font-weight:600; margin:14px 0; }
  label{display:block; font-size:.82rem; font-weight:600; margin:14px 0 6px;}
  input[type=text], input[type=number], input[type=url], textarea, select{
    width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:.95rem;
  }
  textarea{min-height:76px; resize:vertical;}
  .obj-box{display:flex; align-items:center; justify-content:space-between; background:var(--paper); border:1px dashed var(--line); border-radius:10px; padding:12px 14px; margin:10px 0;}
  .progress-bar{height:10px; background:var(--paper); border-radius:6px; overflow:hidden; border:1px solid var(--line); margin-top:8px;}
  .progress-fill{height:100%; background:var(--brand-primary); transition:width .3s ease;}
  .choice-row{display:flex; flex-direction:column; gap:8px; margin-top:8px;}
  .choice{ border:1.5px solid var(--line); border-radius:10px; padding:11px 14px; text-align:left; background:var(--paper); font-size:.92rem; }
  .choice.selected{border-color:var(--brand-primary); background:#E4EEF1;}
  .idea-row{display:flex; gap:8px; align-items:center; margin:8px 0;}
  .idea-row span{font-family:var(--font-display); font-weight:700; opacity:.5; width:22px;}
  .footer-actions{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap;}
  .backlink{display:inline-block; margin-bottom:16px; font-size:.85rem; opacity:.7;}

  .stat-line{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:.9rem;}
  .stat-line:last-child{border-bottom:none;}
  .badge{width:24px; text-align:center;}
  .tabs{display:flex; gap:8px; margin:18px 0 6px; flex-wrap:wrap;}
  .tab{flex:1; min-width:110px; text-align:center; padding:9px; border-radius:10px; border:1.5px solid var(--line); font-weight:600; font-size:.85rem; background:var(--paper-2);}
  .tab.active{background:var(--brand-primary); color:#fff; border-color:var(--brand-primary);}

  .validation-block{border:1.5px solid var(--warning);}
  .validation-block h3{margin:2px 0 4px; font-size:1.05rem;}
  .confirm-panel{text-align:center; padding:34px 18px;}
  .confirm-panel .big{font-size:2.4rem; margin-bottom:8px;}
  .confirm-panel h2{margin:0 0 6px;}

  .history-item{padding:9px 0; border-bottom:1px solid var(--line); font-size:.85rem;}
  .history-item:last-child{border-bottom:none;}
  .history-item small{display:block; opacity:.6; margin-top:2px;}

  .admin-table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); margin-top:16px;}
  table{border-collapse:collapse; width:100%; min-width:1180px; font-size:.8rem;}
  th,td{padding:9px 11px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap;}
  thead th{background:var(--brand-dark); color:var(--brand-light); position:sticky; top:0;}
  tbody tr:hover{background:var(--paper-2); cursor:pointer;}
  .pill{display:inline-block; padding:3px 9px; border-radius:20px; font-size:.72rem; font-weight:700;}
  .pill.ok{background:#DCEFE1; color:var(--success);}
  .pill.mid{background:#FCEBCB; color:#8A5B0E;}
  .pill.no{background:var(--paper-2); color:var(--ink); opacity:.6;}
  .pill.alert{background:#FBE0D6; color:var(--warning);}
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin:16px 0;}
  .kpi{background:var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px;}
  .kpi b{display:block; font-family:var(--font-display); font-size:1.4rem;}
  .kpi span{font-size:.72rem; opacity:.65;}
  .filters{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0;}
  .filters select{width:auto; min-width:140px; font-size:.82rem; padding:8px 10px;}

  .modal-overlay{ position:fixed; inset:0; background:rgba(16,32,28,.55); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
  @media(min-width:640px){ .modal-overlay{align-items:center;} }
  .modal{ background:var(--paper); border-radius:18px 18px 0 0; max-width:560px; width:100%; max-height:88vh; overflow-y:auto; padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px)); }
  @media(min-width:640px){ .modal{border-radius:18px;} }
  .modal h3{margin-top:0;}
  .reopen-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}

  .mentor-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:.88rem;}
  .mentor-row-v2{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:14px 0; border-bottom:1px solid var(--line);}
  .mentor-row-v2:last-of-type{border-bottom:none;}
  .mentor-info{flex:1; min-width:180px;}
  .mentor-info b{font-size:.95rem;}
  .mentor-info small{display:block; opacity:.65; font-size:.78rem; margin-top:2px;}
  .mentor-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .mentor-edit{flex-direction:column; align-items:stretch;}
  .mentor-edit-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; width:100%;}
  .mentor-edit-grid label{margin:0 0 4px;}
  .mentor-row:last-child{border-bottom:none;}
  .mentor-row small{display:block; opacity:.6;}

  .public-fullscreen{
    max-width:1400px; margin:0 auto; padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));
    min-height:100dvh; display:flex; flex-direction:column; overflow-x:auto;
  }
  .public-topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .public-logo{height:26px; opacity:.85;}
  .public-title-compact{font-size:clamp(1.15rem,2.6vw,1.9rem); margin:2px 0 0; line-height:1.1; font-family:var(--font-display);}
  .public-sub-compact{font-size:clamp(.8rem,1.3vw,1rem); opacity:.65; margin:2px 0 12px; font-weight:600;}
  .lm-header-row, .lm-row{
    display:grid; grid-template-columns:minmax(78px,100px) minmax(110px,150px) minmax(240px,1fr) minmax(120px,190px) 56px minmax(110px,170px);
    align-items:center; gap:10px;
  }
  .lm-header-row{padding:0 12px 4px; font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; opacity:.55; font-weight:700;}
  .lm-header-row div:last-child, .lm-header-row div:nth-child(5){text-align:right;}
  .lm-list{display:flex; flex-direction:column; flex:1; justify-content:space-evenly; gap:6px;}
  .lm-row{padding:7px 12px; border-radius:10px; background:var(--paper-2); border:1px solid var(--line);}
  .lm-row.lm-finished{background:linear-gradient(90deg, rgba(47,143,92,.14), var(--paper-2)); border-color:var(--success);}
  .lm-group{font-family:var(--font-display); font-weight:700; font-size:clamp(.85rem,1.6vw,1.1rem); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lm-mission{font-size:clamp(.66rem,1.1vw,.82rem); opacity:.75; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lm-track{display:flex; align-items:center; gap:1px; overflow:visible; min-width:0;}
  .lm-node{
    width:15px; height:15px; min-width:12px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:.52rem; font-weight:700; border:2px solid var(--line); background:var(--paper); color:var(--ink); flex-shrink:1; transition:all .3s ease;
  }
  .lm-connector{flex:1 1 4px; height:3px; background:var(--line); min-width:2px; border-radius:2px;}
  .lm-connector.done{background:var(--success);}
  .lm-node.done{background:var(--success); border-color:var(--success); color:#fff;}
  .lm-node.current{background:var(--brand-primary); border-color:var(--brand-primary); color:#fff; width:21px; height:21px; min-width:18px; font-size:.62rem; box-shadow:0 0 0 3px rgba(13,96,124,.22); flex-shrink:0;}
  .lm-node.waiting{background:var(--brand-secondary); border-color:var(--brand-secondary); color:#fff; width:21px; height:21px; min-width:18px; font-size:.62rem; animation:pulseWait 1.4s ease-in-out infinite; flex-shrink:0;}
  .lm-node.pending{opacity:.4;}
  @keyframes pulseWait{ 0%,100%{ box-shadow:0 0 0 0 rgba(239,143,73,.5); } 50%{ box-shadow:0 0 0 8px rgba(239,143,73,0); } }
  .lm-current{font-size:clamp(.66rem,1.1vw,.82rem); opacity:.8; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lm-pct{font-family:var(--font-display); font-weight:700; font-size:clamp(.9rem,1.6vw,1.2rem); color:var(--brand-primary); text-align:right;}
  .lm-finished .lm-pct{color:var(--success);}
  .lm-estado{font-size:clamp(.64rem,1.1vw,.8rem); font-weight:700; text-align:right; white-space:nowrap;}
  .lm-estado-proceso{color:var(--brand-primary);}
  .lm-estado-esperando{color:var(--brand-secondary);}
  .lm-estado-reformulando{color:var(--warning);}
  .lm-estado-finalizado{color:var(--success);}
  .lm-estado-sin_iniciar{opacity:.55;}
  .public-legend-compact{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; font-size:clamp(.65rem,1.1vw,.8rem); opacity:.7; margin-top:10px;}
  .org-link{display:block; margin-top:14px; font-size:.75rem; opacity:.4; text-decoration:none;}
  .attention-banner{background:#FBEAE3; border:2px solid var(--warning); border-radius:var(--radius); padding:12px 16px; margin:14px 0;}
  .attention-title{font-family:var(--font-display); font-weight:700; color:var(--warning); font-size:.95rem; margin-bottom:8px;}
  .attention-item{
    display:block; width:100%; text-align:left; background:transparent; border:none; border-top:1px solid rgba(194,59,59,.2);
    padding:6px 0; font-size:.85rem; color:var(--ink); font-weight:600;
  }
  .attention-item:first-of-type{border-top:none;}
  .attention-item:hover{color:var(--warning);}
  .chips-row{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0;}
  .chip{border:none; border-radius:20px; padding:6px 14px; font-size:.8rem; font-weight:700;}
  .chip-warn{background:#FBEAE3; color:var(--warning);}
  .chip-ok{background:#DCEFE1; color:var(--success);}
  .pill.proceso{background:#E4EEF1; color:var(--brand-primary);}
  .pill.esperando{background:#FDE9D3; color:#8A4E14;}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){

function safeGet(key){ try{ var v=localStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){ return null; } }

function activatePosta(team,pid){ team.postas[pid].status='current'; team.postas[pid].enteredAt=Date.now(); }
function loadTeam(id){
  var t = safeGet(STORAGE_PREFIX+id);
  if(!t) return defaultTeam(id);
  /* migrate older saved records that predate newer fields, so KPIs and
     alerts never contradict each other because of missing data */
  if(t.lastActivityAt===undefined || t.lastActivityAt===null){ t.lastActivityAt = t.missionAcceptedAt || (t.mission ? Date.now() : null); }
  if(t.pendingRework===undefined) t.pendingRework = null;
  if(t.school!==undefined) delete t.school;
  POSTAS.forEach(function(p){
    if(t.postas[p.id].enteredAt===undefined) t.postas[p.id].enteredAt = (p.id==='p1') ? (t.missionAcceptedAt||Date.now()) : null;
  });
  return t;
}
function saveTeam(t){ t.lastActivityAt=Date.now(); safeSet(STORAGE_PREFIX+t.id, t); }
function saveTeamSilent(t){ safeSet(STORAGE_PREFIX+t.id, t); }
function touchActivity(teamId){ var t=loadTeam(teamId); saveTeam(t); }

function takenMissions(){ return safeGet(MISSIONS_TAKEN_KEY) || []; }

var MENTOR_ESTADOS = [

  {k:'inactivo', t:'Inactivo'}
];
function mentorEstadoLabel(k){ var e=MENTOR_ESTADOS.filter(function(x){return x.k===k;})[0]; return e?e.t:'Disponible'; }
function mentorFullName(m){
  var full=((m.nombre||'')+' '+(m.apellido||'')).trim();
  return full || m.name || 'Mentor';
}
function normalizeMentor(m){
  if(m.estado===undefined){ m.estado = (m.active===false) ? 'inactivo' : 'disponible'; }
  if(m.nombre===undefined || m.apellido===undefined){
    var parts=(m.name||'Mentor').trim().split(' ');
    m.nombre = m.nombre!==undefined ? m.nombre : parts[0];
    m.apellido = m.apellido!==undefined ? m.apellido : parts.slice(1).join(' ');
  }
  m.name = mentorFullName(m);
  if(m.specialty===undefined) m.specialty='';
  if(m.org===undefined) m.org='';
  return m;
}
function defaultMentors(){
  var list=[];
  for(var i=1;i<=10;i++){ list.push(normalizeMentor({id:'me'+i, nombre:'Mentor/a', apellido:String(i), specialty:'', org:'', estado:'disponible'})); }
  return list;
}

  return /^Mentor\/a \d+$/.test(m.name) && !m.specialty && !m.org;

function loadMentors(){
  var stored = safeGet(MENTORS_KEY);
  if(!stored) { var fresh=defaultMentors(); saveMentors(fresh); return fresh; }
  stored = stored.map(normalizeMentor);
  if(stored.length > 0 && stored.length <= 3 && stored.every(isUntouchedPlaceholder)){
    var upgraded=defaultMentors();
    saveMentors(upgraded);
    return upgraded;
  }
  return stored;
}
function saveMentors(list){ safeSet(MENTORS_KEY, list.map(normalizeMentor)); }

function renderWheel(){

function pickMission(){
  var taken=takenMissions();
  var avail=MISSIONS.filter(function(m){ return taken.indexOf(m.id)===-1; });
  if(avail.length===0) avail=MISSIONS.slice();
  return avail[Math.floor(Math.random()*avail.length)];
}
function spinWheel(){
  var wheelEl=document.getElementById('wheelEl');
  var spinBtn=document.getElementById('spinBtn');
  if(!wheelEl || wheelEl.dataset.spinning==='1') return;
  wheelEl.dataset.spinning='1'; spinBtn.setAttribute('disabled','disabled');
  var sliceAngle=360/7; var target=pickMission(); var idx=MISSIONS.indexOf(target);
  var sliceCenter=sliceAngle*idx+sliceAngle/2;
  var finalRotation=5*360+(360-sliceCenter);
  wheelEl.style.transform='rotate('+finalRotation+'deg)';
  setTimeout(function(){ state.wheelLanded=target; wheelEl.dataset.spinning='0'; render(); }, 4300);
}

function publicStatus(team){
  if(countCompleted(team)===7) return 'Finalizado';
  var cur=currentPostaId(team); var st=team.postas[cur].status;
  if(st==='pending_validation') return 'Esperando mentor';
  if(postaHasDraft(team,cur)) return 'En trabajo';
  return 'Posta superada';
}
function postaHasDraft(team,pid){
  var d=team.postas[pid];
  if(pid==='p1') return !!(d.q1||d.q2||d.q3||d.problem);
  if(pid==='p2') return !!(d.count||d.link||d.l1);
  if(pid==='p3') return !!d.challenge;
  if(pid==='p4') return !!(d.solName || (d.ideas||[]).some(function(x){return x;}));
  if(pid==='p5') return !!(d.count||d.link);
  if(pid==='p6') return !!(d.type||d.shows);
  if(pid==='p7') return !!(d.problem||d.solution);
  return false;
}
function lastMentorFor(team){
  var v=team.validations||[];
  if(!v.length) return '—';
  return mentorDisplayName(v.slice().sort(function(a,b){return b.ts-a.ts;})[0]);
}

function cellFor(team,key){
  var d=team.postas;

  if(key==='val1'){ if(d.p2.status==='completed') return pill('ok','Validado'); if(d.p2.status==='pending_validation') return pill('alert','Esperando mentor'); var c=parseInt(d.p2.count||0,10)||0; if(c>0) return pill('mid',c+'/15'); return d.p2.status==='current'?pill('mid','En curso'):pill('no','—'); }
  if(key==='count1') return d.p2.count || '—';
  if(key==='challenge'){ if(d.p3.status==='completed') return pill('ok','Aprobado'); if(d.p3.status==='pending_validation') return pill('alert','Esperando mentor'); return d.p3.status==='current'?pill('mid','En curso'):pill('no','—'); }

  if(key==='val2'){ if(d.p5.status==='completed') return pill('ok','Validado'); if(d.p5.status==='pending_validation') return pill('alert','Esperando mentor'); var c2=parseInt(d.p5.count||0,10)||0; if(c2>0) return pill('mid',c2+'/15'); return d.p5.status==='current'?pill('mid','En curso'):pill('no','—'); }
  if(key==='count2') return d.p5.count || '—';
  if(key==='prototype'){ if(d.p6.status==='completed') return pill('ok','Listo'); if(d.p6.status==='pending_validation') return pill('alert','Esperando mentor'); return d.p6.status==='current'?pill('mid','En curso'):pill('no','—'); }
  if(key==='pitch'){ if(d.p7.status==='completed') return pill('ok','Listo'); if(d.p7.status==='pending_validation') return pill('alert','Esperando mentor'); return d.p7.status==='current'?pill('mid','En curso'):pill('no','—'); }
  return '';
}
function isWaiting(team){ return POSTAS.some(function(p){ return team.postas[p.id].status==='pending_validation'; }); }

var STALL_MINUTES = 15;
function minutesAgo(ts){ if(!ts) return null; return Math.floor((Date.now()-ts)/60000); }
function formatMinutes(mins){
  if(mins===null||mins===undefined) return '—';
  if(mins<1) return 'recién';
  if(mins<60) return mins+' min';
  var h=Math.floor(mins/60), m=mins%60;
  return h+'h '+m+'min';
}
function formatTimestamp(ts){
  if(!ts) return '—';
  var d=new Date(ts);
  var timeStr=d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  return timeStr+' · hace '+formatMinutes(minutesAgo(ts));
}
function hasActivity(team){ return !!team.lastActivityAt; }
function pendingPostas(team){ return POSTAS.filter(function(p){ return team.postas[p.id].status!=='completed'; }).map(function(p){ return 'P'+p.num; }); }
function completedPostas(team){ return POSTAS.filter(function(p){ return team.postas[p.id].status==='completed'; }).map(function(p){ return 'P'+p.num; }); }

/* Single source of truth for "estado actual" — used identically by the
   private panel and the public board so they can never contradict each other. */
function estadoActual(team){
  if(!team.mission) return {key:'sin_iniciar', label:'Sin misión / Sin iniciar', icon:'⚪'};
  if(countCompleted(team)===7) return {key:'finalizado', label:'Finalizado', icon:'🏁'};
  var cur=currentPostaId(team);
  if(team.pendingRework && team.pendingRework.postaId===cur) return {key:'reformulando', label:'Reformulando', icon:'🔄'};
  if(team.postas[cur].status==='pending_validation') return {key:'esperando', label:'Esperando mentor', icon:'🟠'};
  return {key:'proceso', label:'En proceso', icon:'🔵'};
}
function estadoPillClass(key){
  if(key==='finalizado') return 'ok';
  if(key==='esperando') return 'esperando';
  if(key==='reformulando') return 'alert';
  if(key==='proceso') return 'proceso';
  return 'no';
}
/* Separate from "estado actual": the outcome of the team's most recent
   validation checkpoint (independent of what they're doing right now). */
function ultimaValidacion(team){
  if(team.pendingRework){ return {key:'requiere', label:'Requiere reformulación', mentor:null, obs:null, when:null}; }
  var recs=(team.validations||[]).slice().sort(function(a,b){return b.ts-a.ts;});
  if(!recs.length) return {key:'sin', label:'Sin validación', mentor:null, obs:null, when:null};
  var v=recs[0];
  var label = v.verdict==='ajustar' ? 'Aprobada con ajustes' : 'Aprobada';
  return {key: v.verdict==='ajustar'?'ajustes':'aprobada', label:label, mentor:mentorDisplayName(v), obs:v.observation, when:v.date+' · '+v.time};
}
function timeInCurrentPosta(team){
  var cur=currentPostaId(team);
  if(!cur) return null;
  return minutesAgo(team.postas[cur].enteredAt);
}
function attentionItems(teams){
  var items=[];
  teams.forEach(function(t){
    if(!t.mission) return;
    var finished = countCompleted(t)===7;
    if(finished) return;
    if(isWaiting(t)){
      items.push({priority:1, team:t, text:t.label+' — esperando mentor hace '+formatMinutes(minutesAgo(t.lastActivityAt))});
      return;
    }
    if(!hasActivity(t)){
      items.push({priority:2, team:t, text:t.label+' — sin actividad registrada'});
      return;
    }
    var idle=minutesAgo(t.lastActivityAt);
    if(idle!==null && idle>=STALL_MINUTES){
      items.push({priority:3, team:t, text:t.label+' — sin actividad hace '+formatMinutes(idle)});
    }
  });
  items.sort(function(a,b){return a.priority-b.priority;});
  return items;
}
function secondaryCounts(teams){
  return {
    reformulando: teams.filter(function(t){ return t.mission && estadoActual(t).key==='reformulando'; }).length,
    porFinalizar: teams.filter(function(t){ return countCompleted(t)>=6 && countCompleted(t)<7; }).length
  };
}

  }
  return '<div class="attention-banner">' +
    '<div class="attention-title">⚠️ REQUIEREN ATENCIÓN AHORA</div>' +
    items.map(function(it){

    }).join('') +
  '</div>';
}

    var resLabel = v.verdict==='ajustar' ? 'Aprobada con ajustes' : 'Aprobada';
    return '<tr><td>'+esc(mentorDisplayName(v))+'</td><td>'+esc(v.teamLabel)+'</td><td>'+esc(v.mission||'—')+'</td><td>'+esc(v.postaTitle)+'</td><td>'+resLabel+'</td>' +
      '<td style="white-space:normal;font-size:.78rem;max-width:220px;">'+(v.observation?esc(v.observation):'—')+'</td><td>'+v.date+' · '+v.time+'</td></tr>';
  }).join('');

  return '<p style="opacity:.7;font-size:.85rem;">Mentorías registradas — uso interno del equipo organizador.</p>' +
    cards +
    '<div class="filters" style="margin-top:20px;">' +
      '<select data-activity-filter="mentor"><option value="">Todos los mentores</option>'+mentorOpts+'</select>' +
      '<select data-activity-filter="team"><option value="">Todos los grupos</option>'+teamOpts+'</select>' +
      '<select data-activity-filter="posta"><option value="">Todas las postas</option>'+postaOpts+'</select>' +
    '</div>' +
    '<div class="admin-table-wrap"><table>' +
      '<thead><tr><th>Mentor</th><th>Grupo</th><th>Misión</th><th>Posta</th><th>Resultado</th><th>Observación</th><th>Fecha/hora</th></tr></thead>' +
      '<tbody>'+(logRows||'<tr><td colspan="7" style="opacity:.6;">Todavía no hay validaciones registradas.</td></tr>')+'</tbody>' +
    '</table></div>';
}
function setActivityFilter(key,val){ state.activityFilters[key]=val; render(); }


function openAdminDetail(id){ state.adminDetail=id; render(); }
function closeAdminDetail(){ state.adminDetail=null; render(); }
function renderAdminDetailModal(t){
  var lines=POSTAS.map(function(p){
    var st=t.postas[p.id].status;
    var icon = st==='completed'?'✅':(st==='pending_validation'?'🟠':(st==='current'?'🔵':'🔒'));
    var reopenBtn = st==='completed' ? '<button class="btn small ghost" data-reopen="'+t.id+'|'+p.id+'">Reabrir</button>' : '';
    return '<div class="stat-line reopen-row"><div><span class="badge">'+icon+'</span> '+p.title+' — '+postaStatusLabel(st)+'</div>'+reopenBtn+'</div>';
  }).join('');
  var history=(t.validations||[]).slice().sort(function(a,b){return a.ts-b.ts;}).map(function(v){
    var vLabel = v.verdict==='ajustar' ? ' (con ajustes)' : '';
    return '<div class="history-item">'+esc(v.postaTitle)+' — Validada'+vLabel+' por '+esc(mentorDisplayName(v))+'<small>'+v.date+' · '+v.time+(v.observation?' · "'+esc(v.observation)+'"':'')+'</small></div>';
  });
  var estado=estadoActual(t);
  var uv=ultimaValidacion(t);
  var uvLine = '<b>Última validación:</b> '+uv.label + (uv.mentor ? ' — '+esc(uv.mentor)+(uv.when?' · '+uv.when:'') : '') + (uv.obs ? '<br><span style="opacity:.75;">"'+esc(uv.obs)+'"</span>' : '');
  return '<div class="modal-overlay" data-close-admin="1"><div class="modal">' +
    '<h3>'+t.label+'</h3>' +
    '<p style="opacity:.7;font-size:.85rem;">Misión: '+(t.mission?esc(t.mission.name):'Sin asignar')+' · Estado actual: '+estado.icon+' '+estado.label+'</p>' +
    '<div class="card" style="font-size:.85rem;">'+uvLine+'</div>' +
    '<div class="card" style="font-size:.82rem;">' +
      '<b>Completadas:</b> '+(completedPostas(t).length?completedPostas(t).join(', '):'ninguna todavía')+'<br>' +
      '<b>Pendientes:</b> '+(pendingPostas(t).length?pendingPostas(t).join(', '):'ninguna')+'<br>' +
      '<b>Última actividad:</b> '+formatTimestamp(t.lastActivityAt)+'<br>' +
      '<b>Tiempo en posta actual:</b> '+formatMinutes(timeInCurrentPosta(t)) +
    '</div>' +
    '<div class="card">'+lines+'</div>' +
    '<div class="card" style="font-size:.85rem;">' +
      '<b>Problema:</b> '+esc(t.postas.p1.problem||'—')+'<br><br>' +
      '<b>Desafío:</b> '+esc(t.postas.p3.challenge||'—')+'<br><br>' +
      '<b>Solución:</b> '+esc(t.postas.p4.solName||'—') +
    '</div>' +
    '<div class="card"><b style="font-size:.75rem;text-transform:uppercase;opacity:.6;">Historial de validaciones</b>' +
      (history.length ? history.join('') : '<div class="history-item" style="opacity:.6;">Todavía no hay postas validadas.</div>') +
    '</div>' +
    '<div class="footer-actions"><button class="btn ghost" data-action="closeAdminDetail">CERRAR</button></div>' +
  '</div></div>';
}
function reopenPosta(teamId,postaId){
  var team=loadTeam(teamId); var idx=POSTA_INDEX[postaId];
  POSTAS.forEach(function(p,i){
    if(i===idx) activatePosta(team,p.id);
    else if(i>idx) team.postas[p.id].status='locked';
  });
  team.validations=(team.validations||[]).filter(function(v){ return POSTA_INDEX[v.postaId] < idx; });
  team.pendingRework=null;
  saveTeam(team); render();
}

/* ---------- PUBLIC RACE PANEL ---------- */
function laneNodes(team){
  var cur = currentPostaId(team);
  var nodes = [];
  nodes.push({label:'🏁', state: team.mission ? 'done' : 'pending'});
  POSTAS.forEach(function(p){
    var st=team.postas[p.id].status; var s;
    if(st==='completed') s='done';
    else if(p.id===cur) s = (st==='pending_validation') ? 'waiting' : 'current';
    else s='pending';
    nodes.push({label:String(p.num), state:s});
  });
  nodes.push({label:'🏆', state: cur ? 'pending' : 'done'});
  return nodes;
}
function renderPublic(){
  var teams = TEAM_IDS.map(loadTeam);
  var rows = teams.map(function(t){
    var completed=countCompleted(t); var pct=Math.round((completed/7)*100);
    var cur=currentPostaId(t);
    var curLabel = cur ? ('P'+POSTA_BY_ID[cur].num+' · '+POSTA_BY_ID[cur].title) : 'Completo';
    var nodes = laneNodes(t);
    var estado = estadoActual(t);
    var track = nodes.map(function(n,i){
      var connector = i>0 ? '<div class="lm-connector '+((nodes[i-1].state==='done')?'done':'')+'"></div>' : '';
      return connector + '<div class="lm-node '+n.state+'">'+n.label+'</div>';
    }).join('');
    return '<div class="lm-row '+(estado.key==='finalizado'?'lm-finished':'')+'">' +
      '<div class="lm-group">'+t.label+'</div>' +
      '<div class="lm-mission">'+(t.mission?(t.mission.icon+' '+esc(t.mission.name)):'Sin misión')+'</div>' +
      '<div class="lm-track">'+track+'</div>' +
      '<div class="lm-current">'+esc(curLabel)+'</div>' +
      '<div class="lm-pct">'+pct+'%</div>' +
      '<div class="lm-estado lm-estado-'+estado.key+'">'+estado.icon+' '+estado.label+'</div>' +
    '</div>';
  }).join('');
  return '<div class="public-fullscreen">' +
    '<div class="public-topbar">' +
      '<button class="btn secondary small" data-nav="welcome">← VOLVER / INICIO</button>' +
      (LOGO_FULL_B64 ? '<img src="data:image/png;base64,'+LOGO_FULL_B64+'" alt="+I" class="public-logo">' : '') +
    '</div>' +
    '<h1 class="public-title-compact">RUTA IDEATHON 2026 – PROGRESO EN VIVO</h1>' +
    '<p class="public-sub-compact">7 grupos · 7 misiones · una meta</p>' +
    '<div class="lm-header-row">' +
      '<div>Grupo</div><div>Misión</div><div>Ruta P1–P7</div><div>Posta actual</div><div>%</div><div>Estado</div>' +
    '</div>' +
    '<div class="lm-list">'+rows+'</div>' +
    '<div class="public-legend-compact">' +
      '<span>✅ Posta completada</span><span>🔵 En proceso</span><span>🟠 Esperando mentor</span>' +
      '<span>🔄 Reformulando</span><span>⚪ Sin misión / sin iniciar</span><span>🏁 Finalizado</span>' +
    '</div>' +
  '</div>';
}

/* ---------- EVENTS ---------- */
function afterRender(){
  var app=document.getElementById('app');
  app.onclick=function(e){
    var el;
    el=e.target.closest('[data-nav]'); if(el){ e.preventDefault(); go(el.getAttribute('data-nav')); return; }
    el=e.target.closest('[data-team]'); if(el){ state.teamId=el.getAttribute('data-team'); var t=loadTeam(state.teamId); go(t.mission?'map':'wheel'); return; }
    el=e.target.closest('#spinBtn'); if(el && !el.disabled){ spinWheel(); return; }
    el=e.target.closest('[data-action="acceptMission"]'); if(el){ acceptMission(); return; }
    el=e.target.closest('[data-tab]'); if(el){ state.tab=el.getAttribute('data-tab'); render(); return; }
    el=e.target.closest('[data-admintab]'); if(el){ state.adminTab=el.getAttribute('data-admintab'); state.editingMentorId=null; state.confirmDeleteMentorId=null; state.showAddMentorForm=false; render(); return; }
    el=e.target.closest('[data-posta]'); if(el){ openPosta(el.getAttribute('data-posta')); return; }
    el=e.target.closest('[data-verdict]'); if(el){ setVerdict(el.getAttribute('data-verdict-for'), el.getAttribute('data-verdict')); return; }
    el=e.target.closest('[data-action="openForm"]'); if(el && !el.disabled){ openForm(); return; }
    el=e.target.closest('[data-action="closeGuideForm"]'); if(el){ closeGuideForm(); return; }
    el=e.target.closest('[data-action="openOrgGate"]'); if(el){ e.preventDefault(); openOrgGate(); return; }
    el=e.target.closest('[data-action="closeOrgGate"]'); if(el){ closeOrgGate(); return; }
    el=e.target.closest('[data-action="submitOrgPin"]'); if(el){ submitOrgPin(); return; }
    el=e.target.closest('[data-action="requestP1"]'); if(el){ requestP1(); return; }
    el=e.target.closest('[data-action="requestP2"]'); if(el){ requestP2(); return; }
    el=e.target.closest('[data-action="requestP3"]'); if(el){ requestP3(); return; }
    el=e.target.closest('[data-action="requestP4"]'); if(el){ requestP4(); return; }
    el=e.target.closest('[data-action="requestP5"]'); if(el){ requestP5(); return; }
    el=e.target.closest('[data-action="requestP6"]'); if(el){ requestP6(); return; }
    el=e.target.closest('[data-action="requestP7"]'); if(el){ requestP7(); return; }
    el=e.target.closest('[data-action="approvePosta"]'); if(el){ approvePosta(el.getAttribute('data-approve-posta')); return; }
    el=e.target.closest('[data-action="continueAfterConfirm"]'); if(el){ continueAfterConfirm(); return; }
    el=e.target.closest('[data-detail]'); if(el){ openAdminDetail(el.getAttribute('data-detail')); return; }
    el=e.target.closest('[data-action="closeAdminDetail"]'); if(el){ closeAdminDetail(); return; }
    el=e.target.closest('[data-reopen]'); if(el){ var parts=el.getAttribute('data-reopen').split('|'); reopenPosta(parts[0],parts[1]); return; }
    el=e.target.closest('[data-action="editMentor"]'); if(el){ editMentor(el.getAttribute('data-mentor-id')); return; }
    el=e.target.closest('[data-action="cancelMentorEdit"]'); if(el){ cancelMentorEdit(); return; }
    el=e.target.closest('[data-action="saveMentorEdit"]'); if(el){ saveMentorEdit(el.getAttribute('data-mentor-id')); return; }
    el=e.target.closest('[data-action="askDeleteMentor"]'); if(el){ askDeleteMentor(el.getAttribute('data-mentor-id')); return; }
    el=e.target.closest('[data-action="cancelDeleteMentor"]'); if(el){ cancelDeleteMentor(); return; }
    el=e.target.closest('[data-action="confirmDeleteMentor"]'); if(el){ confirmDeleteMentor(el.getAttribute('data-mentor-id')); return; }
    el=e.target.closest('[data-action="openAddMentorForm"]'); if(el){ openAddMentorForm(); return; }
    el=e.target.closest('[data-action="cancelAddMentor"]'); if(el){ cancelAddMentor(); return; }
    el=e.target.closest('[data-action="addMentor"]'); if(el){ addMentor(); return; }
    el=e.target.closest('[data-action="saveOrgPinConfig"]'); if(el){ saveOrgPinConfig(); return; }
    el=e.target.closest('[data-action="askResetAll"]'); if(el){ askResetAll(); return; }
    el=e.target.closest('[data-action="cancelResetAll"]'); if(el){ cancelResetAll(); return; }
    el=e.target.closest('[data-action="confirmResetAll"]'); if(el){ confirmResetAll(); return; }
    el=e.target.closest('[data-action="filterEstado"]'); if(el){ filterEstado(el.getAttribute('data-estado-key')); return; }
    if(e.target.classList.contains('modal-overlay')){
      if(e.target.getAttribute('data-close-guide')) closeGuideForm();
      if(e.target.getAttribute('data-close-admin')) closeAdminDetail();
      if(e.target.getAttribute('data-close-org')) closeOrgGate();
    }
  };
  app.onchange=function(e){
    var el=e.target.closest('[data-filter]');
    if(el){ setAdminFilter(el.getAttribute('data-filter'), el.value); return; }
    el=e.target.closest('[data-activity-filter]');
    if(el){ setActivityFilter(el.getAttribute('data-activity-filter'), el.value); return; }
  };
  app.oninput=function(e){
    if(e.target.id==='p2count') updateLiveProgress('p2', e.target.value);
    if(e.target.id==='p5count') updateLiveProgress('p5', e.target.value);
  };
}

/* ---------- INIT / HASH ROUTING (staff access) ---------- */
var hash = (window.location.hash || '').replace('#','');
if(hash === 'admin') state.showOrgGate=true;
else if(hash === 'public') state.screen='public';

render();

/* Live-ish updates: re-render periodically for timers, and react to changes
   made in other tabs of the same browser (localStorage 'storage' event). */
setInterval(function(){
  if(state.screen==='admin' || state.screen==='public'){ render(); }
}, 5000);
window.addEventListener('storage', function(e){
  if(e.key && e.key.indexOf(STORAGE_PREFIX)===0){
    if(state.screen==='admin' || state.screen==='public'){ render(); }
  }
});
})();
</script>
